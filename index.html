// Calibration sweep — capture video durations + slide thumbnails
async function _preloadAllImages(){
  const imgs=Array.from(document.querySelectorAll('#deck img'));
  await Promise.all(imgs.map(img=>{
    if(img.complete&&img.naturalWidth>0)return Promise.resolve();
    img.loading='eager';
    return new Promise(res=>{
      let done=false;const fin=()=>{if(done)return;done=true;res();};
      img.addEventListener('load',fin,{once:true});
      img.addEventListener('error',fin,{once:true});
      setTimeout(fin,4000);
      // Re-trigger load if needed
      if(!img.src){fin();return;}
      const orig=img.src;img.src='';img.src=orig;
    });
  }));
}
async function _preloadVideoFrames(){
  const vids=Array.from(document.querySelectorAll('#deck video'));
  await Promise.all(vids.map(v=>{
    if(v.readyState>=2)return Promise.resolve();
    return new Promise(res=>{
      let done=false;const fin=()=>{if(done)return;done=true;res();};
      v.addEventListener('loadeddata',fin,{once:true});
      v.addEventListener('error',fin,{once:true});
      setTimeout(fin,5000);
      if(v.preload==='none')v.preload='metadata';
      try{v.load();}catch(_){}
    });
  }));
}
function _drawCoverFit(ctx,src,sw,sh,dw,dh){
  if(!sw||!sh)return false;
  const ratio=Math.max(dw/sw,dh/sh);
  const tw=sw*ratio,th=sh*ratio;
  ctx.drawImage(src,(dw-tw)/2,(dh-th)/2,tw,th);
  return true;
}
function captureSlideThumb(idx,W,H){
  W=W||160;H=H||90;
  const sl=allSlides[idx];if(!sl)return null;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#06080f';ctx.fillRect(0,0,W,H);
  // Try first <img> (handle SVGs whose naturalWidth may be 0)
  const img=sl.querySelector('img');
  if(img&&img.complete){
    const sw=img.naturalWidth||img.width||300;
    const sh=img.naturalHeight||img.height||200;
    if(sw>0&&sh>0){
      try{_drawCoverFit(ctx,img,sw,sh,W,H);return canvas.toDataURL('image/jpeg',0.55);}
      catch(e){/* CORS-tainted, fall through */}
    }
  }
  // Try first inner <canvas> (MEDIA_CYCLER mount renders into one)
  const innerCnv=sl.querySelector('.media-cycler-mount canvas, canvas:not(#stars)');
  if(innerCnv&&innerCnv.width>0){
    try{_drawCoverFit(ctx,innerCnv,innerCnv.width,innerCnv.height,W,H);return canvas.toDataURL('image/jpeg',0.55);}
    catch(e){}
  }
  // Try first <video>
  const vid=sl.querySelector('video');
  if(vid&&vid.videoWidth>0){
    try{_drawCoverFit(ctx,vid,vid.videoWidth,vid.videoHeight,W,H);return canvas.toDataURL('image/jpeg',0.55);}
    catch(e){}
  }
  // Fallback: rendered text card
  return _renderTextCardThumb(sl,idx,W,H);
}
function _renderTextCardThumb(sl,idx,W,H){
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const ty=sl.dataset.type||'';
  const accent=sl.classList.contains('accent-purple')?'#a78bfa':sl.classList.contains('accent-amber')?'#f59e0b':sl.classList.contains('accent-rose')?'#f43f5e':'#00d4ff';
  // Background
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#0a0d1c');grad.addColorStop(1,'#1a1530');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=accent+'22';ctx.fillRect(0,0,4,H);
  // Slide number
  ctx.fillStyle=accent;ctx.font='700 9px sans-serif';
  ctx.fillText(String(idx).padStart(2,'0'),10,14);
  // Type badge
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='700 7px sans-serif';
  ctx.fillText((ty||'slide').toUpperCase(),W-Math.min(W-12,40),14);
  // Title (word-wrapped)
  const title=getSlideTitle(idx)||'';
  ctx.fillStyle='rgba(240,244,255,.92)';ctx.font='600 11px sans-serif';
  const words=title.split(/\s+/);
  let line='',y=34;
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>W-20&&line){ctx.fillText(line,10,y);line=w;y+=14;if(y>H-6)return;}
    else line=test;
  });
  if(line&&y<=H-4)ctx.fillText(line,10,y);
  return canvas.toDataURL('image/jpeg',0.65);
}
async function runCalibration(){
  naToast('Calibrating…');
  const t0=Date.now();
  // Force-load images and video metadata so captures aren't blank
  await Promise.race([Promise.all([_preloadAllImages(),_preloadVideoFrames()]),new Promise(r=>setTimeout(r,8000))]);
  // Video durations
  const videoDurations={};
  const seen=new Set();
  for(let i=0;i<allSlides.length;i++){
    const vids=allSlides[i].querySelectorAll('video');
    for(const v of vids){
      if(!v.src||seen.has(v.src))continue;seen.add(v.src);
      if(isFinite(v.duration)&&v.duration>0)videoDurations[v.src]=Number(v.duration.toFixed(1));
    }
  }
  _videoDurationCache=videoDurations;
  // Slide thumbnails
  const thumbnails={};
  for(let i=0;i<allSlides.length;i++){
    const sl=allSlides[i];
    if(sl.dataset.hidden==='1')continue;
    if(sl.dataset.type==='settings')continue;
    try{const t=captureSlideThumb(i,160,90);if(t)thumbnails[i]=t;}catch(e){}
  }
  _slideThumbs=thumbnails;
  // Cache to localStorage (per-deckId)
  try{
    const cfg=window._notesConfig;const deckId=(cfg&&cfg.deckId)||'default';
    localStorage.setItem('sd-thumbs-'+deckId,JSON.stringify(thumbnails));
    localStorage.setItem('sd-vidcache-'+deckId,JSON.stringify(videoDurations));
    localStorage.setItem('sd-calibrated-'+deckId,'1');
  }catch(e){}
  const calibration={videoDurations,calibratedAt:new Date().toISOString(),slideCount:Object.keys(thumbnails).length};
  try{await syncCall('setMeta',{key:'calibration',value:calibration});naToast('Calibration saved · '+Object.keys(thumbnails).length+' thumbs · '+Object.keys(videoDurations).length+' videos');}
  catch(e){naToast('Calibration local only · '+Object.keys(thumbnails).length+' thumbs');}
  _renderTopbar();
  console.log('[calibration] '+(Date.now()-t0)+'ms · '+Object.keys(thumbnails).length+' thumbs · '+Object.keys(videoDurations).length+' videos');
}

// Notes-mode init
async function initNotesMode(){
  const cfg=await loadNotesConfig();
  // Load cached thumbs / video durations from localStorage (per-deckId)
  try{
    const deckId=(cfg&&cfg.deckId)||'default';
    const t=localStorage.getItem('sd-thumbs-'+deckId);if(t)_slideThumbs=JSON.parse(t)||{};
    const v=localStorage.getItem('sd-vidcache-'+deckId);if(v)_videoDurationCache=JSON.parse(v)||{};
  }catch(e){}
  if(!cfg){
    // Non-blocking toast — local-only mode is fine for demo / first run
    setTimeout(()=>naToast('Local-only mode (no cloud sync)'),300);
  }else{
    try{
      const data=await syncCall('getNotes',{});
      if(!data.slides||!data.slides.length){
        await seedFromSections(false);
        const fresh=await syncCall('getNotes',{});
        _applyNotesData(fresh);
        naToast('Sheet seeded ('+(fresh.slides||[]).length+' slides)');
      }else{
        _applyNotesData(data);
      }
    }catch(e){if(!e._offline){console.warn('cloud sync failed',e);naToast('Sync error: '+e.message);}}
  }
  _setupNavButtons();
  _renderTopbar();naRenderContent();_updateNavBarVisibility();
  // First-run calibration nudge — driven by an explicit flag, fired synchronously
  const _deckId=(cfg&&cfg.deckId)||'default';
  const _calFlag='sd-calibrated-'+_deckId;
  if(localStorage.getItem(_calFlag)!=='1'){
    const ov=document.createElement('div');ov.className='na-config-prompt';ov.id='na-first-prompt';
    ov.innerHTML='<h2>Quick setup</h2><p>Run <strong>Calibrate</strong> once to capture next-slide thumbnails and video durations. Takes ~5–10 seconds. Re-run from <strong>⋯ &middot; Calibrate</strong> any time.</p><div style="display:flex;gap:10px;margin-top:8px"><button class="na-iconbtn" id="ncp-skip">Skip</button><button class="na-iconbtn active" id="ncp-now" style="background:rgba(0,212,255,.25);border-color:rgba(0,212,255,.6);color:#00d4ff">Calibrate now</button></div>';
    document.body.appendChild(ov);
    ov.querySelector('#ncp-skip').addEventListener('click',()=>{localStorage.setItem(_calFlag,'1');ov.remove();});
    ov.querySelector('#ncp-now').addEventListener('click',async()=>{ov.remove();await runCalibration();localStorage.setItem(_calFlag,'1');});
  }
  // Wire buttons
  document.getElementById('na-timer-btn').addEventListener('click',e=>{e.stopPropagation();naStartPause();});
  let resetHold=null;
  const rb=document.getElementById('na-reset-btn');
  const rDown=e=>{e.preventDefault();rb.classList.add('holding');rb.textContent='HOLD…';resetHold=setTimeout(()=>{naReset();naToast('Timer reset');rb.classList.remove('holding');rb.textContent='⟲';},900);};
  const rCancel=()=>{clearTimeout(resetHold);rb.classList.remove('holding');rb.textContent='⟲';};
  rb.addEventListener('pointerdown',rDown);
  rb.addEventListener('pointerup',rCancel);
  rb.addEventListener('pointerleave',rCancel);
  rb.addEventListener('pointercancel',rCancel);
  document.getElementById('na-lock-btn').addEventListener('click',e=>{e.stopPropagation();naToggleLock();});
  document.getElementById('na-edit-btn').addEventListener('click',e=>{e.stopPropagation();_notesView.editing=!_notesView.editing;_notesView.docOpen=false;naRenderContent();_updateNavBarVisibility();});
  document.getElementById('na-preview-btn')?.addEventListener('click',e=>{e.stopPropagation();const panel=document.getElementById('na-slide-preview');if(!panel)return;const open=panel.classList.toggle('open');document.getElementById('na-preview-btn').classList.toggle('active',open);if(open)_updateSlidePreview();});
  document.getElementById('na-tp-save').addEventListener('click',naSaveTarget);
  document.getElementById('na-tp-clear').addEventListener('click',naClearTarget);
  // Settings drawer
  const sdEl=document.getElementById('na-settings-drawer');
  const sdStatus=document.getElementById('na-sd-status');
  const sdDefView=document.getElementById('na-sd-defview');
  if(_notesMeta.default_view)sdDefView.value=_notesMeta.default_view;
  document.getElementById('na-settings-btn').addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('na-target-pick').classList.remove('open');
    sdEl.classList.toggle('open');
    if(sdEl.classList.contains('open')&&_notesMeta.default_view)sdDefView.value=_notesMeta.default_view;
  });
  document.getElementById('na-sd-close').addEventListener('click',()=>sdEl.classList.remove('open'));
  // Doc + Target moved into settings drawer
  document.getElementById('na-sd-doc').addEventListener('click',()=>{sdEl.classList.remove('open');_notesView.docOpen=!_notesView.docOpen;_notesView.editing=false;naRenderContent();_updateNavBarVisibility();});
  document.getElementById('na-sd-target').addEventListener('click',()=>{sdEl.classList.remove('open');naOpenTargetPicker();});
  sdDefView.addEventListener('change',async()=>{
    _notesMeta.default_view=sdDefView.value;
    sdStatus.textContent='Default view: '+sdDefView.value;
    naRenderContent();
    try{await syncCall('setMeta',{key:'default_view',value:sdDefView.value});sdStatus.textContent='Saved · default = '+sdDefView.value;}
    catch(e){sdStatus.textContent='Local only';}
  });
  document.getElementById('na-sd-calibrate').addEventListener('click',async()=>{
    sdStatus.textContent='Calibrating videos…';
    try{await runCalibration();sdStatus.textContent='Calibration done';}catch(e){sdStatus.textContent='Failed: '+e.message;}
  });
  document.getElementById('na-sd-reseed').addEventListener('click',async()=>{
    if(!confirm('Overwrite sheet rows for this deck with current SECTIONS notes?'))return;
    sdStatus.textContent='Reseeding…';
    try{await seedFromSections(true);const fresh=await syncCall('getNotes',{});_applyNotesData(fresh);naRenderContent();sdStatus.textContent='Reseeded · '+(fresh.slides||[]).length+' slides';}
    catch(e){sdStatus.textContent='Failed: '+e.message;}
  });
  // Refresh pacing every second
  setInterval(_updatePacingDisplay,1000);
  // Hook navigation
  const _origUH=updateHUD;updateHUD=function(){_origUH();_onSlideChange(current);if(document.body.classList.contains('notes-mode')){_renderTopbar();naRenderContent();}};
}

// Laptop side: if NOT in notes mode, but config exists, listen for clicker
async function initLaptopClickerListener(){
  const cfg=await loadNotesConfig();if(!cfg)return;
  try{const data=await syncCall('getNotes',{});_applyNotesData(data);}catch(e){}
  _startClickerListenerForLaptop();
}

// Boot — pick a path
if(_notesParam){
  // Phone notes mode
  setTimeout(initNotesMode,200);
}else{
  // Main deck — still load notes overrides + cache so calibration data, etc. apply
  setTimeout(initLaptopClickerListener,400);
  // Hook _onSlideChange even on laptop so adaptive WPM data can be gathered if you ever switch to ?notes mid-talk
  const _origUH2=updateHUD;updateHUD=function(){_origUH2();_onSlideChange(current);};
}

updateHUD();
{
  const _hasHash=!!location.hash.replace('#','');
  const _isEdit=new URLSearchParams(location.search).has('edit');
  if(!_hasHash&&_isEdit){goTo(0);}else{goToFromHash();}
