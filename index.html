<script>
/* =======================================================================

   Each section = a year/chapter with 1 lesson + N case studies.
   Edit SECTIONS to change all content. Everything else is generated.

const SECTIONS = [
  { year: 2020, accent: 'teal',
    lesson: { title:'Look for Theater People,\nNot Just Tech People', short:'THEATER > TECH', tagline:'The best XR teams look nothing like tech teams. Look for studios that hire architects, theater directors, lighting designers \u2014 not just Unity devs.<br><br>The secret weapon of every great XR studio is the person who has never opened a game engine.', tags:'Interdisciplinary \u00b7 Spatial Thinking', notes:'Open with a provocative question: how many people in this room have hired a Unity developer? Now ask how many have hired a theater director. The gap between those two numbers is the problem.\n- Emphasize that spatial thinking predates VR by centuries\n- Mention architecture, set design, and choreography as XR superpowers\n- Pause here to let the audience absorb the counter-intuitive framing' },
    cases: [
      { title:'Case Study: The Shed @ Hudson Yards', subtitle:'Architecture meets immersive design',
        img:'', bullets:['A great XR studio brings spatial thinkers to the table','Look for portfolios that span disciplines, not just game engines','Ask: \u201cWho on your team has NEVER written code?\u201d'], notes:'Talk about how The Shed was designed by Diller Scofidio + Renfro as a kinetic architecture piece. The building literally moves. That is spatial thinking at its most ambitious.' },
      { title:'Case Study: Ghosted (Magic Leap)', subtitle:'When 90% of the team is non-technical',
        img:'', bullets:['Creative-first teams build experiences, not demos','The best XR work comes from people who think about presence, not polygons','Red flag: if every team member\'s bio mentions the same engine'], notes:'Ghosted shipped with a team that was 90% non-technical. Highlight this as a feature, not a bug. The creative-first approach led to one of the most emotionally resonant Magic Leap experiences.' },
    ] },
  { year: 2021, accent: 'purple',
    lesson: { title:'Demand a Discovery Phase.\nBefore Anyone Builds.', short:'DISCOVERY FIRST', tagline:'If a studio says \u201csure, we can start next week\u201d \u2014 run. Good XR work starts with questions, not timelines.<br><br>The studio that asks for a discovery budget respects the problem. The one that doesn\'t? They\'re guessing.', tags:'R&D \u00b7 Process \u00b7 Due Diligence', notes:'This is the slide where you earn trust with procurement people in the audience. Discovery phases sound expensive, but they are insurance.\n- Ask the audience: who has been burned by a project that skipped research?\n- The $60K number from Four Seasons is coming next, so set it up here\n- Key point: discovery is not a delay, it is acceleration' },
    cases: [
      { title:'Case Study: Four Seasons Lake Austin', subtitle:'$60K of R&D before a single line of code',
        img:'', bullets:['The studio that asks for a discovery budget respects the problem','R&D phases protect both the client and the team','Ask: \u201cWhat happens if the tech doesn\'t work?\u201d'], notes:'Let the $60K number land. That is a lot of money for research before writing code. But the alternative was a $400K build with no validation. Frame it as a bargain.' },
      { title:'Case Study: Body of Mine', subtitle:'Experimental hardware needs experimental process',
        img:'', bullets:['Full-body VR tracking required months of R&D','Studios that skip discovery ship demos, not experiences','BAFTA and Producers Guild recognition followed the process, not the pitch'], notes:'Body of Mine won recognition precisely because they invested in process. The BAFTA nomination did not come from rushing to production. Mention the haptic suit challenges.' },
    ] },
  { year: 2022, accent: 'amber',
    lesson: { title:'Check Their Tools.\nThey\'re a Business Strategy.', short:'TOOLS = STRATEGY', tagline:'A studio\'s engine choice tells you everything about their priorities. WebXR for accessibility. Unreal for fidelity. Both is ideal.<br><br>Don\'t hire the studio that uses every tool. Hire the one that knows exactly why they chose theirs.', tags:'Unreal Engine \u00b7 WebXR \u00b7 Pipeline', notes:'This lesson resonates most with CTOs and technical leads. Slow down and speak their language.\n- The engine choice question is a litmus test for self-awareness\n- WebXR vs native is not a quality debate, it is a distribution strategy debate\n- Mention that the best studios have opinions, not just capabilities' },
    cases: [
      { title:'Case Study: OnboardXR', subtitle:'WebXR that runs in any browser',
        img:'', bullets:['No app store, no headset required \u2014 accessible by default','The right tool for the job isn\'t always the most powerful one','Ask: \u201cCan my grandmother experience this from her iPad?\u201d'], notes:'OnboardXR is a perfect illustration of tool choice matching audience needs. Emphasize the grandmother test: if she cannot open a link in Safari and see something, you have already lost 80% of your audience.' },
      { title:'Case Study: Blueprint Immersive', subtitle:'From bespoke projects to a scalable product',
        img:'', bullets:['Studios that build their own tools understand your pipeline','Productized workflows = predictable timelines and budgets','The leap from bespoke to scalable is a maturity signal'], notes:'Blueprint Immersive went from custom projects to a repeatable product. This is the maturity arc you want to see in a studio. If they have productized anything, they understand your timelines.' },
    ] },
  { year: 2023, accent: 'teal',
    lesson: { title:'They Should Say \u201cNo\u201d\nMore Than \u201cYes\u201d', short:'SCOPE DISCIPLINE', tagline:'Complex projects breed scope creep. The studio that says \u201cwe could, but we shouldn\'t\u201d is the one that ships on time.<br><br>The most dangerous word in XR is \u201cyes.\u201d The second most dangerous is \u201cand.\u201d', tags:'Scope \u00b7 Boundaries \u00b7 Delivery', notes:'This is the slide that gets knowing nods from anyone who has shipped a project. Scope creep is universal.\n- Pause after the yes/and line for laughter\n- Transition into the cases by asking: what does scope discipline look like in practice?\n- This lesson is the audience favorite at most talks, lean into it' },
    cases: [
      { title:'Case Study: La Pasion XR', subtitle:'Cultural sensitivity requires scope boundaries',
        img:'', bullets:['The more meaningful the project, the harder it is to draw lines','Good studios distinguish \u201cwe could\u201d from \u201cwe should\u201d','Ask: \u201cTell me about a feature you CUT from a recent project\u201d'], notes:'La Pasion XR dealt with sacred cultural content. Every feature addition risked misrepresentation. The discipline to say no here was not just project management, it was ethics.' },
      { title:'Case Study: Your Mind, Girls', subtitle:'$0 revenue from a genuinely excellent piece',
        img:'', bullets:['Scope creep turned a small script into a full co-production','Beautiful work, zero dollars \u2014 passion without boundaries is a warning sign','Ask: \u201cWhat\'s your process for saying no to a great idea?\u201d'], notes:'This is a cautionary tale. The work was genuinely excellent, but $0 revenue means the studio could not sustain itself. Use this to illustrate the difference between passion and business viability.' },
    ] },
  { year: 2024, accent: 'rose',
    lesson: { title:'The Demo Will Break.\nHire the Studio That Plans for It.', short:'PLAN FOR FAILURE', tagline:'In XR, something goes wrong every single time. The question isn\'t whether the demo breaks \u2014 it\'s whether the audience notices.<br><br>Nobody knows what you envisioned. When something fails, pivot gracefully \u2014 the audience experiences what you show them, not what you planned.', tags:'Contingency \u00b7 Resilience \u00b7 Live XR', notes:'Tell a personal war story here if you have one. Every XR practitioner has a demo failure moment.\n- The pivot gracefully line is the thesis of the entire talk\n- This lesson sets up the Royal Caribbean story perfectly\n- End with: the audience only sees what you show them, not what you planned' },
    cases: [
      { title:'Case Study: Royal Caribbean', subtitle:'When it breaks at sea, there\'s no IT department',
        img:'', bullets:['Satellite Wi-Fi, salt air, motion sickness \u2014 the most constrained environment','Graceful fallbacks built into every moment of the experience','Ask: \u201cWalk me through your plan B. And your plan C.\u201d'], notes:'Royal Caribbean is the ultimate stress test. Satellite internet, salt corrosion on hardware, and guests who get motion sick. If your XR works on a cruise ship, it works anywhere. Get a laugh here.' },
      { title:'Case Study: Stage Presence \u00d7 RSC', subtitle:'The Royal Shakespeare Company in VR',
        img:'', bullets:['VR UX is best when it adapts workflows people already know','Every actor wanted a script they could hold \u2014 same as paper','The studio that doesn\'t reinvent the wheel ships faster'], notes:'Stage Presence is a story about humility. The Royal Shakespeare Company actors did not want a holographic teleprompter. They wanted paper scripts. The studio that listens ships faster than the one that innovates for its own sake.' },
    ] },
];

const BONUS = { year:2025, title:'Find the Studio That\nBuilds Community.',
  tagline:'The best studios don\'t just ship projects \u2014 they build ecosystems. Meetups, open demos, genuine feedback from real humans. That\'s how you know they care about the craft, not just the contract.<br><br>P.S. We know a studio that checks all five boxes. Just saying.' };
</script>

(function(){
  const container=document.createElement('div');
  container.style.cssText='position:absolute;right:10%;top:50%;transform:translateY(-50%);width:300px;height:300px;pointer-events:auto;z-index:2';
  bon.appendChild(container);
  const canvas=document.createElement('canvas');
  canvas.width=600;canvas.height=600;
  canvas.style.cssText='width:100%;height:100%;cursor:grab';
  container.appendChild(canvas);
  let running=false,renderer,scene,camera,group,rafId;
  let isDragging=false,prevMouse={x:0,y:0},autoRotate=true,resumeTimer;
  async function init(){
    if(running)return;
    const THREE=await import('three');
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(40,1,0.1,100);
    camera.position.set(0,0,8);
    renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    renderer.setSize(600,600);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    // Lights
    scene.add(new THREE.AmbientLight(0x8888cc,0.5));
    const dLight=new THREE.DirectionalLight(0xffffff,1.2);
    dLight.position.set(5,5,5);scene.add(dLight);
    const pLight=new THREE.PointLight(0x00d4ff,0.3);
    pLight.position.set(0,0,2.5);scene.add(pLight);
    // Materials
    const ringMat=new THREE.MeshStandardMaterial({color:0xf59e0b,metalness:0.7,roughness:0.3});
    const lensMat=new THREE.MeshStandardMaterial({color:0x00d4ff,transparent:true,opacity:0.15,metalness:0.1,roughness:0.4,side:THREE.DoubleSide});
    const cordMat=new THREE.MeshStandardMaterial({color:0xd97706,metalness:0.6,roughness:0.35});
    // Group
    group=new THREE.Group();
    // Torus (monocle ring)
    const torus=new THREE.Mesh(new THREE.TorusGeometry(2,0.15,24,64),ringMat);
    group.add(torus);
    // Lens disc
    const lens=new THREE.Mesh(new THREE.CircleGeometry(1.85,48),lensMat);
    group.add(lens);
    // Cord curve
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,-2,0),
      new THREE.Vector3(-0.6,-2.8,0.3),
      new THREE.Vector3(-1.2,-3.5,0.1),
      new THREE.Vector3(-1.0,-4.2,-0.2)
    ]);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.06,8,false),cordMat);
    group.add(tube);
    // Eyepiece sphere
    const eyepiece=new THREE.Mesh(new THREE.SphereGeometry(0.18,16,16),cordMat);
    eyepiece.position.set(-1.0,-4.2,-0.2);
    group.add(eyepiece);
    scene.add(group);
    // Drag rotation
    canvas.addEventListener('mousedown',onDown);
    canvas.addEventListener('touchstart',onTouchDown,{passive:false});
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onTouchMove,{passive:false});
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchend',onUp);
    running=true;autoRotate=true;let baseX=0;
    function animate(){
      if(!running){rafId=null;return;}
      if(autoRotate){
        group.rotation.y+=0.005;
        group.rotation.x=baseX+Math.sin(Date.now()*0.0008)*0.15;
      } else {
        baseX=group.rotation.x;
      }
      renderer.render(scene,camera);
      rafId=requestAnimationFrame(animate);
    }
    rafId=requestAnimationFrame(animate);
  }
  function onDown(e){isDragging=true;prevMouse={x:e.clientX,y:e.clientY};canvas.style.cursor='grabbing';autoRotate=false;clearTimeout(resumeTimer);}
  function onTouchDown(e){if(e.touches.length===1){e.preventDefault();isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};autoRotate=false;clearTimeout(resumeTimer);}}
  function onMove(e){if(!isDragging||!group)return;const dx=e.clientX-prevMouse.x,dy=e.clientY-prevMouse.y;group.rotation.y+=dx*0.01;group.rotation.x+=dy*0.01;prevMouse={x:e.clientX,y:e.clientY};}
  function onTouchMove(e){if(!isDragging||!group||e.touches.length!==1)return;e.preventDefault();const dx=e.touches[0].clientX-prevMouse.x,dy=e.touches[0].clientY-prevMouse.y;group.rotation.y+=dx*0.01;group.rotation.x+=dy*0.01;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  function onUp(){if(!isDragging)return;isDragging=false;canvas.style.cursor='grab';resumeTimer=setTimeout(()=>{autoRotate=true;},2000);}
  function dispose(){
    running=false;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    clearTimeout(resumeTimer);isDragging=false;autoRotate=true;
    canvas.removeEventListener('mousedown',onDown);
    canvas.removeEventListener('touchstart',onTouchDown);
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('touchmove',onTouchMove);
    window.removeEventListener('mouseup',onUp);
    window.removeEventListener('touchend',onUp);
    if(renderer){renderer.dispose();renderer=null;}
    if(scene){scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}});scene=null;}
    group=null;camera=null;
  }
  new MutationObserver(()=>{
    if(bon.classList.contains('active')){setTimeout(init,400);}
    else if(running){dispose();}
  }).observe(bon,{attributes:true,attributeFilter:['class']});
  if(bon.classList.contains('active'))setTimeout(init,400);
})();

let current=1,total=allSlides.length,direction=1;
function nextVisible(f,d){let i=f;for(let n=0;n<total;n++){i=(i+d+total)%total;if(allSlides[i].dataset.hidden!=='1')return i;}return f;}
function goTo(n,fwd){if(n<0||n>=total||n===current)return;window._killAllSfx();const dir=fwd!==undefined?fwd:n>current;direction=dir?1:-1;const trans=JSON.parse(localStorage.getItem('sd-cfg')||'{}').transition||'slide';const prev=allSlides[current];prev.classList.remove('active');if(trans==='none'){prev.style.animation='';}else{let exitAnim;if(trans==='fade')exitAnim='fadeOut';else if(trans==='zoom')exitAnim=dir?'zoomOutFwd':'zoomOutBwd';else exitAnim=dir?'slideOutFwd':'slideOutBwd';prev.style.animation=exitAnim+' .4s ease forwards';setTimeout(()=>{prev.style.animation='';},450);}current=n;const next=allSlides[current];next.classList.add('active');if(trans==='none'){next.style.animation='';}else{let enterAnim;if(trans==='fade')enterAnim='fadeIn';else if(trans==='zoom')enterAnim=dir?'zoomInFwd':'zoomInBwd';else enterAnim=dir?'slideInFwd':'slideInBwd';next.style.animation=enterAnim+' .4s ease forwards';setTimeout(()=>{next.style.animation='';},450);}updateHUD();updateHash();playWhoosh();if(typeof gridEnsureSlide==='function')gridEnsureSlide();}
function goNext(){goTo(nextVisible(current,1),true);}
function goPrev(){goTo(nextVisible(current,-1),false);}
function advanceStep(){const ss=slideSteps.get(allSlides[current]);if(ss&&ss.current<ss.steps.length){ss.steps[ss.current]();ss.current++;updateStepIndicator();return true;}return false;}
function updateStepIndicator(){const el=document.getElementById('step-indicator');const ss=slideSteps.get(allSlides[current]);el.textContent=(ss&&ss.current<ss.steps.length)?`Step ${ss.current+1}/${ss.steps.length}`:'';}
function updateHUD(){document.getElementById('counter').textContent=`${String(current).padStart(2,'0')} / ${total-1}`;updateStepIndicator();buildGrid();}
function updateHash(){location.hash=current>1?current:'';}
function goToFromHash(){const h=parseInt(location.hash.replace('#',''));if(h>=0&&h<total)goTo(h);}

(function(){
  const SK='sd-snapshots';let lastHash='',autoTimer=null,interacted=false;
  function snapHash(){return(localStorage.getItem('sd-annos')||'[]')+(localStorage.getItem('sd-cfg')||'{}');}

  document.addEventListener('click',function once(){if(interacted)return;interacted=true;startAutoSave();},{once:false});
  document.addEventListener('keydown',function(){if(!interacted){interacted=true;startAutoSave();}},{once:true});
  function timeAgo(ts){const d=Math.floor((Date.now()-ts)/1000);if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return new Date(ts).toLocaleString();}

    const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;font-family:var(--font)';

    box.appendChild(list);
    const cancelBtn=document.createElement('button');cancelBtn.textContent='Cancel';cancelBtn.style.cssText='background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);color:var(--rose);font-family:var(--font);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:10px 20px;border-radius:6px;cursor:pointer;width:100%';cancelBtn.addEventListener('click',()=>{ov.remove();});

const _notesCh=new BroadcastChannel('spatial-deck');

// Build notes index: map slide index -> notes text
function getSlideNotes(idx){
  const sl=allSlides[idx];if(!sl)return'';
  const ty=sl.dataset.type,si=+sl.dataset.section;
  if(ty==='lesson'&&SECTIONS[si])return SECTIONS[si].lesson.notes||'';
  if(ty==='case'&&SECTIONS[si]){
    // figure out which case within the section
    let caseIdx=0;for(let j=lessonIdxs[si]+1;j<idx;j++){if(allSlides[j]?.dataset.type==='case')caseIdx++;}
    return SECTIONS[si].cases[caseIdx]?.notes||'';
  }
  if(ty==='bonus')return'Bonus lesson: rally the audience. This is the call to action. Build energy and end strong.';
  if(ty==='cover')return'Welcome the audience. Wait for stragglers. Introduce yourself and the talk theme.';
  if(ty==='close')return'Wrap up. Point to the QR codes. Thank the audience. Open for questions.';
  if(ty==='map')return'The constellation map is a visual summary of the journey. Let it breathe for a moment before moving on.';
  if(ty==='settings')return'Settings slide. Not shown to the audience during presentation mode.';
  return'';
}
function getSlideTitle(idx){
  const sl=allSlides[idx];if(!sl)return'';
  const el=sl.querySelector('.lesson-title,.case-title,.talk-title,.close-title,.cfg-title,.map-label');
  return el?el.textContent.replace(/\n/g,' '):'Slide '+(idx+1);
}

<script>

document.getElementById('pn-slide').textContent='Slide '+d.slideNum+' / '+d.total;

<\/script></body></html>`);
  _notesWin.document.close();

function sendNotesUpdate(){
  const nextIdx=nextVisible(current,1);
  const data={type:'notes-update',slideNum:current+1,total:total,title:getSlideTitle(current),notes:getSlideNotes(current),nextTitle:nextIdx!==current?getSlideTitle(nextIdx):''};
  _notesCh.postMessage(data);
  // Also update local popup if open
  if(_notesWin&&!_notesWin.closed){
    const doc=_notesWin.document;
    if(doc.getElementById('pn-slide')){
      doc.getElementById('pn-slide').textContent='Slide '+data.slideNum+' / '+data.total;
      doc.getElementById('pn-title').textContent=data.title;
      doc.getElementById('pn-notes').textContent=data.notes||'(no notes)';
      doc.getElementById('pn-next').textContent=data.nextTitle||'(end)';
    }
  }
}

// =====================================================================
// FEATURE: TALK DURATION ESTIMATOR
// =====================================================================
function estimateSlideDuration(idx){
  const notes=getSlideNotes(idx);
  const sl=allSlides[idx];
  const ty=sl?.dataset.type||'';
  let seconds=0;
  if(!notes||notes.trim()===''){
    seconds=30; // no notes default
  }else{
    const lines=notes.split('\n').filter(l=>l.trim());
    lines.forEach(line=>{
      const trimmed=line.trim();
      const isBullet=/^[-\u2022*]/.test(trimmed);
      const wordCount=trimmed.split(/\s+/).length;
      if(isBullet||wordCount<15){
        seconds+=20; // bullet point: ~20s
      }else{
        seconds+=Math.ceil(wordCount/150*60); // full sentence: words/150 WPM
      }
    });
  }
  // Lesson slides: add 10 seconds natural pause
  if(ty==='lesson'||ty==='bonus')seconds+=10;
  // Steps: add 5s per step beyond first
  const ss=slideSteps.get(sl);
  if(ss&&ss.steps.length>1)seconds+=(ss.steps.length-1)*5;
  return seconds;
}

function calcTotalDuration(){
  let total=0;
  for(let i=0;i<allSlides.length;i++){
    if(allSlides[i].dataset.hidden==='1')continue;
    total+=estimateSlideDuration(i);
  }
  return total;
}

function fmtTime(secs){
  const m=Math.floor(secs/60),s=Math.floor(secs%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function updateDurationDisplay(){
  const el=document.getElementById('v-duration');
  if(el)el.textContent='~'+fmtTime(calcTotalDuration());
}

// Timer & pacing
let _timerInterval=null;
function startTalkTimer(){
  if(_talkStartTime)return;
  _talkStartTime=Date.now();
  _timerInterval=setInterval(updateTimers,1000);
}
function updateTimers(){
  if(!_talkStartTime)return;
  const elapsedSec=Math.floor((Date.now()-_talkStartTime)/1000);
  const totalEst=calcTotalDuration();
  const remainSec=Math.max(0,totalEst-elapsedSec);
  const elapsed=fmtTime(elapsedSec);
  const remaining='~'+fmtTime(remainSec);
  let paceIcon='\uD83D\uDFE2'; // green
  if(elapsedSec>totalEst*1.25)paceIcon='\uD83D\uDD34'; // red 25%+
  else if(elapsedSec>totalEst*1.1)paceIcon='\uD83D\uDFE1'; // yellow 10%+
  const data={type:'timer-update',elapsed,remaining,paceIcon};
  _notesCh.postMessage(data);
  if(_notesWin&&!_notesWin.closed){
    const doc=_notesWin.document;
    if(doc.getElementById('pn-elapsed')){
      doc.getElementById('pn-elapsed').textContent=elapsed;
      doc.getElementById('pn-remain').textContent=remaining;
      doc.getElementById('pn-pace-icon').textContent=paceIcon;
    }
  }
}

async function runInlineExport(){
  const prog=document.getElementById('em-progress');
  const btn=document.getElementById('em-inline');
  btn.disabled=true;
  prog.textContent='Fetching external resources...';
  try{
    // Clone the document
    const html=document.documentElement.cloneNode(true);
    // Inline Google Fonts
    const fontLinks=html.querySelectorAll('link[href*="fonts.googleapis"]');
    for(const link of fontLinks){
      try{
        prog.textContent='Fetching fonts from '+link.href.substring(0,60)+'...';
        const resp=await fetch(link.href);
        const css=await resp.text();
        // Fetch each woff2 url and convert to base64
        const urls=[...css.matchAll(/url\(([^)]+)\)/g)].map(m=>m[1]);
        let inlinedCSS=css;
        for(const url of urls){
          try{
            const fontResp=await fetch(url);
            const blob=await fontResp.blob();
            const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
            inlinedCSS=inlinedCSS.replace(url,b64);
          }catch(e){/* skip individual font */}
        }
        const style=document.createElement('style');
        style.textContent=inlinedCSS;
        link.parentNode.replaceChild(style,link);
      }catch(e){/* skip font link */}
    }
    // Inline QR codes
    const qrImgs=html.querySelectorAll('img[src*="api.qrserver"]');
    for(const img of qrImgs){
      try{
        prog.textContent='Fetching QR code...';
        const resp=await fetch(img.src);
        const blob=await resp.blob();
        const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
        img.src=b64;
      }catch(e){/* skip */}
    }
    // Remove preconnect links
    html.querySelectorAll('link[rel="preconnect"]').forEach(l=>l.remove());
    // Build download blob
    prog.textContent='Building self-contained file...';
    const blob=new Blob(['<!DOCTYPE html>\n'+html.outerHTML],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='spatial-deck-offline.html';
    a.style.cssText='display:inline-block;margin-top:10px;color:var(--teal);font-weight:600;font-size:.82rem;text-decoration:underline;cursor:pointer;';
    a.textContent='Download spatial-deck-offline.html ('+Math.round(blob.size/1024)+' KB)';
    prog.textContent='';
    prog.appendChild(a);
    btn.disabled=false;
  }catch(e){
    prog.textContent='Error: '+e.message;
    btn.disabled=false;
  }
}
