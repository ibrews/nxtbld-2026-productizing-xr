#move-hud{position:fixed;top:24px;left:280px;z-index:1000;display:none;align-items:center;gap:8px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:6px 12px;backdrop-filter:blur(8px)}
#move-hud.visible{display:flex}
#move-hud .mh-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);font-family:var(--font);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:5px;cursor:pointer;transition:all .15s}
#move-hud .mh-btn:hover:not(:disabled){background:rgba(245,158,11,.2);color:var(--amber)}
#move-hud .mh-sep{color:rgba(255,255,255,.15);font-size:.8rem;margin:0 2px}
body.move-mode .slide.active{overflow:visible}
#move-hud .mh-btn:disabled{opacity:.3;cursor:not-allowed}
#move-hud .mh-hint{font-size:.6rem;color:rgba(255,255,255,.45);padding:0 4px}
#move-hud .mh-hint kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:1px 5px;font-family:inherit;color:var(--amber)}
body.annotate-mode *:not(#anno-panel):not(#anno-panel *):not(#anno-toggle):not(#move-toggle):not(#slide-grid):not(#slide-grid *):hover{outline:2px dashed var(--teal)!important;outline-offset:2px;cursor:crosshair!important}
body.move-mode .slide.active *:not(#anno-toggle):not(#move-toggle):hover{outline:2px dashed var(--amber)!important;outline-offset:2px;cursor:move!important}
body.move-mode .slide.active *{user-select:none}
body.edit-text .slide.active [contenteditable="true"]{outline:2px solid var(--teal)!important;cursor:text!important;user-select:text!important;background:rgba(0,212,255,.08)}
.dragging{opacity:.85!important;outline:2px solid var(--amber)!important}
#anno-panel{position:fixed;top:70px;left:24px;z-index:1001;width:320px;max-height:70vh;background:rgba(10,12,24,.96);border:1px solid rgba(0,212,255,.3);border-radius:10px;padding:16px;font-family:var(--font);font-size:.78rem;color:var(--text);backdrop-filter:blur(12px);overflow-y:auto;display:none}
#anno-panel.visible{display:block}
#anno-panel h3{font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
#anno-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:300px;overflow-y:auto}
.anno-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 10px;font-size:.72rem;line-height:1.4}
.anno-item .anno-meta{font-size:.6rem;color:var(--dim);margin-bottom:4px}
.anno-item .anno-rm{float:right;color:var(--rose);cursor:pointer;font-size:.68rem;opacity:.6}
.anno-item .anno-rm:hover{opacity:1}
.anno-actions{display:flex;gap:8px}
.anno-btn{flex:1;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--teal);font-family:var(--font);font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px;border-radius:5px;cursor:pointer;transition:all .15s}
.anno-btn:hover{background:rgba(0,212,255,.2)}
.anno-btn.danger{color:var(--rose);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.06)}
#anno-prompt{position:fixed;z-index:1002;background:rgba(10,12,24,.98);border:1px solid var(--teal);border-radius:8px;padding:12px;display:none;flex-direction:column;gap:8px;width:280px;backdrop-filter:blur(12px)}
#anno-prompt.visible{display:flex}
#anno-prompt .anno-target{font-size:.62rem;color:var(--dim);font-family:monospace;word-break:break-all}
#anno-prompt textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text);font-family:var(--font);font-size:.78rem;padding:8px;border-radius:5px;resize:vertical;min-height:60px;outline:none}
#anno-prompt textarea:focus{border-color:var(--teal)}
#anno-prompt .anno-prompt-actions{display:flex;gap:6px;justify-content:flex-end}
#anno-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--teal);color:#060810;padding:10px 18px;border-radius:6px;font-size:.72rem;font-weight:600;z-index:1003;opacity:0;transition:opacity .3s;pointer-events:none}
#anno-toast.show{opacity:1}
@media(max-width:900px){.case-slide{flex-direction:column;text-align:center}.case-image{flex:none;width:85%;max-width:none;margin:0 auto}.case-bl li{text-align:left}}
/* === SPEAKER NOTES DRAWER === */
#notes-drawer{position:fixed;bottom:0;left:0;right:0;z-index:400;max-height:30vh;overflow-y:auto;background:rgba(6,8,16,.88);backdrop-filter:blur(14px);border-top:1px solid rgba(0,212,255,.25);padding:18px 32px;font-family:var(--font);font-size:.88rem;color:rgba(240,244,255,.8);line-height:1.7;transform:translateY(100%);transition:transform .3s ease;pointer-events:none}
#notes-drawer.visible{transform:translateY(0);pointer-events:all}
#notes-drawer .nd-title{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
#notes-drawer .nd-body{white-space:pre-line}
/* === SPLIT PRESENTER VIEW === */
body.split-view #deck{bottom:42vh!important}
body.split-view #notes-drawer{transform:none!important;pointer-events:all;max-height:42vh;height:42vh;overflow-y:auto}
body.split-view #brand{bottom:calc(42vh + 6px)!important}
body.split-view .nav-arrows{bottom:calc(42vh + 4px)!important}
/* === CURRENT SLIDE PREVIEW (?notes companion) === */
#na-slide-preview{overflow:hidden;transition:max-height .28s ease,opacity .28s ease,padding .28s ease;max-height:0;opacity:0;padding:0 14px;flex:0 0 auto}
#na-slide-preview.open{max-height:200px;opacity:1;padding:8px 14px 0}
#na-slide-preview .na-sp-label{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px}
#na-slide-preview img{width:100%;border-radius:6px;display:block;border:1px solid rgba(255,255,255,.1)}
#na-slide-preview .na-sp-placeholder{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:.78rem;color:rgba(255,255,255,.25);font-style:italic;border:1px dashed rgba(255,255,255,.1);border-radius:6px;text-align:center;padding:8px}
/* === EXPORT MODAL === */
#export-modal{position:fixed;inset:0;z-index:600;background:rgba(3,5,12,.88);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#export-modal.open{opacity:1;pointer-events:all}
#export-modal .em-box{width:min(780px,92vw);max-height:84vh;overflow-y:auto;background:rgba(14,16,28,.98);border:1px solid rgba(0,212,255,.2);border-radius:16px;padding:36px 40px;font-family:var(--font);color:var(--text)}
#export-modal .em-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
#export-modal .em-sub{font-size:.72rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
#export-modal .em-section{margin-bottom:20px}
#export-modal .em-section h4{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
#export-modal .em-check{display:flex;align-items:flex-start;gap:8px;font-size:.82rem;color:rgba(240,244,255,.7);line-height:1.5;margin-bottom:6px}
#export-modal .em-check .em-box-icon{color:var(--dim);font-size:.9rem;flex-shrink:0}
#export-modal code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:3px;font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--teal)}
#export-modal pre{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 14px;font-size:.72rem;font-family:'JetBrains Mono',monospace;color:rgba(240,244,255,.7);line-height:1.6;overflow-x:auto;margin:8px 0 12px}
#export-modal .em-tip{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:12px 14px;font-size:.78rem;color:rgba(245,158,11,.85);line-height:1.5;margin-top:16px}
#export-modal .em-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
#export-modal .em-btn{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--teal);font-family:var(--font);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px;border-radius:6px;cursor:pointer;transition:all .15s}
#export-modal .em-btn:hover{background:rgba(0,212,255,.2)}
#export-modal .em-btn.primary{background:var(--teal);color:#060810;border-color:var(--teal)}
#export-modal .em-btn.primary:hover{background:#33dfff}
#export-modal .em-btn:disabled{opacity:.4;cursor:not-allowed}
#export-modal .em-progress{font-size:.72rem;color:var(--dim);margin-top:10px}
.cfg-btn-export{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--teal);font-family:var(--font);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px;border-radius:6px;cursor:pointer;transition:all .15s;margin-top:8px}
.cfg-btn-export:hover{background:rgba(0,212,255,.18)}
/* === LAYOUT: PIPELINE-DIAGRAM (Venn-overlap chart of products × shared capabilities) === */
.case-slide.layout-pipeline-diagram{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.5vw,40px);padding:clamp(50px,5vw,110px)}
.pipeline-stage{width:100%;max-width:1300px;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.5vw,22px)}
.pipeline-stage h2{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:500;color:rgba(240,244,255,.78);letter-spacing:-.01em;line-height:1.2;margin:0}
.pipeline-stage .pipeline-sub{font-size:clamp(1rem,1.6vw,1.55rem);color:rgba(240,244,255,.6);font-style:italic;text-align:center;margin:0}
.pipeline-svg{width:100%;height:auto;max-height:62vh;aspect-ratio:1200/620}
.pipeline-compare{display:flex;gap:clamp(16px,2vw,32px);width:100%;align-items:center;justify-content:center}
.pipeline-compare .pipeline-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.pipeline-compare .pipeline-side-label{font-size:.85rem;color:rgba(240,244,255,.55);font-style:italic;letter-spacing:.05em;text-transform:uppercase}
.pipeline-compare .pipeline-side img{width:100%;height:auto;border-radius:8px;opacity:.85;border:1px solid rgba(255,255,255,.06);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.pipeline-svg .pipe-product{font-size:22px;font-weight:700;letter-spacing:.005em}
.pipeline-svg .pipe-cap{font-size:14px;font-weight:600;fill:rgba(240,244,255,.88);letter-spacing:.06em;text-transform:uppercase}
.pipeline-svg .pipe-cap-dot{fill:rgba(240,244,255,.5)}
/* === LAYOUT: TYPEWRITER (2-column, types items left→right and top→bottom) === */
.case-slide.layout-typewriter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.5vw,40px);padding:clamp(50px,5vw,110px)}
.typewriter-header{text-align:center}
.typewriter-eyebrow{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:500;color:rgba(240,244,255,.78);letter-spacing:-.01em;line-height:1.2;margin:0}
.typewriter-title{font-size:clamp(2.5rem,5.5vw,5.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(135deg,#fff 30%,#a5e8ff 70%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:.2em 0 0}
.typewriter-cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,5vw,80px);width:100%;max-width:1300px;font-family:'Space Grotesk',ui-monospace,monospace}
.typewriter-col{display:flex;flex-direction:column;gap:clamp(10px,1.5vh,22px);min-width:0}
.typewriter-item{font-size:clamp(1rem,1.8vw,1.5rem);font-weight:500;color:rgba(240,244,255,.92);line-height:1.5;text-align:left;white-space:pre-wrap;min-height:1.5em;position:relative}
.typewriter-item::after{content:'\25AE';display:inline-block;color:var(--teal);margin-left:.1em;opacity:0;transform:translateY(-.05em);font-size:.85em;vertical-align:baseline}
.typewriter-item.is-typing::after{opacity:1;animation:typewriterCaret .6s steps(1) infinite}
@keyframes typewriterCaret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
/* === LAYOUT: CREDITS (static title/subtitle at top, only the items list scrolls below) === */
.case-slide.layout-credits{display:flex;align-items:center;justify-content:center;padding:0}
.credits-stage{position:relative;aspect-ratio:16/9;width:100%;height:auto;max-height:100%;max-width:calc(100vh*16/9);overflow:hidden}
/* Static header pinned to top — does NOT scroll */
.credits-header{position:absolute;top:clamp(40px,7vh,90px);left:0;right:0;text-align:center;z-index:3;pointer-events:none;padding:0 clamp(40px,5vw,90px)}
.credits-eyebrow{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:500;color:rgba(240,244,255,.78);letter-spacing:-.01em;margin:0;line-height:1.2}
.credits-title{font-size:clamp(2.5rem,5.5vw,5.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(135deg,#fff 30%,#a5e8ff 70%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:.25em 0 0}
/* Top fade so scrolling items dissolve as they pass behind the header */
.credits-stage::before{content:'';position:absolute;top:0;left:0;right:0;height:clamp(150px,28vh,260px);background:linear-gradient(to bottom,rgba(6,8,16,.97) 0%,rgba(6,8,16,.85) 55%,rgba(6,8,16,0) 100%);z-index:2;pointer-events:none}
/* Scrolling list of features — title/subtitle live above this and stay put */
.credits-track{position:absolute;top:100%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2vh,32px);padding:clamp(40px,5vw,90px);text-align:center;animation:creditsScroll 38s linear infinite;will-change:transform;z-index:1}
.credits-section{font-size:clamp(1rem,1.6vw,1.55rem);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,212,255,.8);margin:2.2em 0 .4em;line-height:1.2}
.credits-item{font-size:clamp(1.1rem,2vw,1.8rem);font-weight:500;color:rgba(240,244,255,.92);line-height:1.4;max-width:900px}
.credits-sep{height:1px;width:160px;background:linear-gradient(to right,transparent,rgba(255,255,255,.25),transparent);margin:.4em 0}
@keyframes creditsScroll{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 100vh))}}
/* === LAYOUT: ASSET-BELT (text overlay first, fades to 50%, then conveyor enters from right) === */
.case-slide.layout-asset-belt{display:flex;align-items:center;justify-content:center;padding:0}
.asset-belt-stage{position:relative;aspect-ratio:16/9;width:100%;height:auto;max-height:100%;max-width:calc(100vh*16/9);overflow:hidden;display:flex;align-items:center;justify-content:center}
.asset-belt-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.5vw,40px);padding:clamp(50px,5vw,110px);text-align:center;z-index:1;pointer-events:none;opacity:1;max-width:1300px;margin:0 auto;left:0;right:0}
.asset-belt-overlay .big-eyebrow{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:500;color:rgba(240,244,255,.78);letter-spacing:-.01em;line-height:1.2}
.asset-belt-overlay .big-text{font-size:clamp(3rem,8vw,8rem);font-weight:700;letter-spacing:-.04em;line-height:1.15;background:linear-gradient(135deg,#fff 30%,#a5e8ff 70%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0}
.asset-belt-overlay .big-caption{font-size:clamp(1rem,1.6vw,1.55rem);color:rgba(240,244,255,.65);font-style:italic;line-height:1.45;max-width:900px}
@keyframes assetBeltOverlayFade{from{opacity:1}to{opacity:.5}}
.asset-belt-track{display:flex;gap:4vw;height:62%;align-items:center;position:absolute;left:100%;top:19%;will-change:transform;z-index:10}
.asset-belt-item{height:100%;flex-shrink:0;border-radius:8px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.55);background:rgba(6,8,16,.95)}
.asset-belt-item img,.asset-belt-item video{height:100%;width:auto;display:block;object-fit:contain}
@keyframes assetBeltScroll{from{transform:translateX(0)}to{transform:translateX(calc(-100% - 100vw))}}
/* === LAYOUT: PLACED (PPT-coordinate absolute positioning) === */
.case-slide.layout-placed{display:flex;align-items:center;justify-content:center;padding:0}
.placed-stage{position:relative;aspect-ratio:16/9;width:100%;height:auto;max-height:100%;max-width:calc(100vh*16/9);overflow:hidden}
.placed-item{position:absolute;overflow:hidden;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.placed-item img,.placed-item video{width:100%;height:100%;object-fit:contain;display:block}
.placed-text{display:flex;align-items:center;background:rgba(6,8,16,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.3);padding:clamp(20px,2.5vw,44px);border-radius:14px}
.placed-text-inner{width:100%;text-align:left}
.placed-text-h{font-size:6rem;font-weight:700;color:#f0f4ff;margin:0 0 .65em;letter-spacing:-.02em;line-height:1.15}
.placed-text-list{list-style:none;padding:0;margin:0}
.placed-text-list li{padding:.55em 0 .55em 34px;position:relative;font-size:4rem;color:rgba(240,244,255,.9);line-height:1.45}
.placed-text-list li::before{content:'';position:absolute;left:0;top:1em;width:18px;height:2px;background:var(--amber);border-radius:2px}
.placed-text.placed-text--plain{background:none;backdrop-filter:none;border:none;box-shadow:none;padding:clamp(8px,1vw,16px);justify-content:center}
.placed-text--plain .placed-text-inner{text-align:center}
.placed-origins{font-size:clamp(3rem,7vw,6.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-align:center;background:linear-gradient(135deg,#fff 30%,#a5e8ff 70%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0}
.placed-overlay{position:absolute;left:48px;bottom:5%;background:rgba(6,8,16,.65);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);padding:14px 28px;border-radius:12px;z-index:5;max-width:80%}
.placed-title{font-size:clamp(1rem,1.7vw,1.5rem);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.placed-sub{font-size:clamp(.8rem,1.1vw,1rem);color:rgba(240,244,255,.75);line-height:1.4;margin-top:4px}
/* === LAYOUT: BIG (full-slide statement text) === */
.case-slide.layout-big{flex-direction:column;text-align:center;padding:clamp(50px,5vw,110px);justify-content:center;align-items:center}
.case-slide.layout-big .big-stack{display:flex;flex-direction:column;gap:clamp(18px,2.5vw,40px);align-items:center;max-width:1300px}
.case-slide.layout-big .big-eyebrow{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:500;color:rgba(240,244,255,.78);letter-spacing:-.01em;line-height:1.2}
.case-slide.layout-big .big-sub{font-size:clamp(.95rem,1.5vw,1.4rem);color:var(--dim);font-style:italic;line-height:1.45}
.case-slide.layout-big .big-text{font-size:clamp(3rem,8vw,8rem);font-weight:700;letter-spacing:-.04em;line-height:1.15;background:linear-gradient(135deg,#fff 30%,#ffd6e1 70%,#c5b6ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.case-slide.layout-big .big-caption{font-size:clamp(1rem,1.6vw,1.55rem);color:rgba(240,244,255,.65);font-style:italic;line-height:1.45;max-width:900px}
.accent-amber .case-slide.layout-big .big-text,.accent-amber.case-slide.layout-big .big-text{background:linear-gradient(135deg,#fff 30%,#ffe6a5 70%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.accent-purple .case-slide.layout-big .big-text,.accent-purple.case-slide.layout-big .big-text{background:linear-gradient(135deg,#fff 30%,#ddd2ff 70%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.accent-rose .case-slide.layout-big .big-text,.accent-rose.case-slide.layout-big .big-text{background:linear-gradient(135deg,#fff 30%,#ffd6e1 70%,#f43f5e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.accent-teal .case-slide.layout-big .big-text,.accent-teal.case-slide.layout-big .big-text{background:linear-gradient(135deg,#fff 30%,#a5e8ff 70%,#00d4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.big-pill{display:inline-flex;align-items:center;padding:6px 22px;border-radius:999px;border:1.5px solid;font-size:clamp(.65rem,.85vw,.8rem);font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:4px}
.big-pill.accent-amber{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.55);color:var(--amber)}

/* === ANIMATED BACKGROUND OVERLAYS — driven by body[data-bg-style] === */
.bg-overlay{position:absolute;inset:0;display:none;pointer-events:none;mix-blend-mode:var(--bg-blend,screen);overflow:hidden}
body[data-bg-style="aurora"] .bg-overlay--aurora,
body[data-bg-style="ember"]  .bg-overlay--ember,
body[data-bg-style="ghost"]  .bg-overlay--ghost,
body[data-bg-style="nebula"] .bg-overlay--nebula,
body[data-bg-style="extreme"] .bg-overlay--extreme{display:block}
.bg-overlay .blob{position:absolute;border-radius:50%;will-change:transform}
/* Aurora */
.bg-overlay--aurora .blob{filter:blur(110px)}
.bg-overlay--aurora .b1{width:55%;aspect-ratio:1;background:radial-gradient(circle,rgba(0,212,255,.55),rgba(0,212,255,0));top:-10%;left:-10%;animation:bgAur1 26s linear infinite}
.bg-overlay--aurora .b2{width:48%;aspect-ratio:1;background:radial-gradient(circle,rgba(167,139,250,.5),rgba(167,139,250,0));top:30%;right:-10%;animation:bgAur2 32s linear infinite}
.bg-overlay--aurora .b3{width:62%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,158,11,.32),rgba(245,158,11,0));bottom:-20%;left:10%;animation:bgAur3 38s linear infinite}
@keyframes bgAur1{0%{transform:translate(0,0)}25%{transform:translate(28vw,18vh)}50%{transform:translate(40vw,38vh)}75%{transform:translate(12vw,28vh)}100%{transform:translate(0,0)}}

@keyframes bgAur3{0%{transform:translate(0,0)}25%{transform:translate(18vw,-15vh)}50%{transform:translate(28vw,-30vh)}75%{transform:translate(8vw,-18vh)}100%{transform:translate(0,0)}}

.bg-overlay--ember .blob{filter:blur(140px);will-change:transform,opacity}
.bg-overlay--ember .b1{width:60%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,158,11,.5),rgba(245,158,11,0));top:-15%;left:20%;animation:bgEm1 32s linear infinite,bgEmP1 9s ease-in-out infinite alternate}
.bg-overlay--ember .b2{width:50%;aspect-ratio:1;background:radial-gradient(circle,rgba(244,63,94,.35),rgba(244,63,94,0));bottom:-10%;right:-5%;animation:bgEm2 40s linear infinite,bgEmP2 12s ease-in-out infinite alternate}
.bg-overlay--ember .b3{width:40%;aspect-ratio:1;background:radial-gradient(circle,rgba(254,215,170,.18),rgba(254,215,170,0));top:50%;left:-10%;animation:bgEm3 36s linear infinite,bgEmP3 14s ease-in-out infinite alternate}
@keyframes bgEm1{0%{transform:translate(0,0)}25%{transform:translate(-15vw,18vh)}50%{transform:translate(-22vw,28vh)}75%{transform:translate(-8vw,18vh)}100%{transform:translate(0,0)}}

@keyframes bgEm3{0%{transform:translate(0,0)}25%{transform:translate(28vw,-6vh)}50%{transform:translate(38vw,-12vh)}75%{transform:translate(20vw,-4vh)}100%{transform:translate(0,0)}}
@keyframes bgEmP1{0%{opacity:.7}100%{opacity:1}}
@keyframes bgEmP2{0%{opacity:.55}100%{opacity:1}}
@keyframes bgEmP3{0%{opacity:.5}100%{opacity:.95}}
/* Ghost */
.bg-overlay--ghost .blob{filter:blur(140px)}
.bg-overlay--ghost .b1{width:50%;aspect-ratio:1;background:radial-gradient(circle,rgba(180,210,255,.32),rgba(180,210,255,0));top:10%;left:5%;animation:bgGh1 28s linear infinite}
.bg-overlay--ghost .b2{width:42%;aspect-ratio:1;background:radial-gradient(circle,rgba(220,200,255,.28),rgba(220,200,255,0));top:30%;right:5%;animation:bgGh2 36s linear infinite}

.bg-overlay--ghost .b4{width:38%;aspect-ratio:1;background:radial-gradient(circle,rgba(200,210,250,.22),rgba(200,210,250,0));top:55%;left:-5%;animation:bgGh4 44s linear infinite}
@keyframes bgGh1{0%{transform:translate(0,0)}25%{transform:translate(20vw,12vh)}50%{transform:translate(28vw,-2vh)}75%{transform:translate(10vw,-12vh)}100%{transform:translate(0,0)}}
@keyframes bgGh2{0%{transform:translate(0,0)}25%{transform:translate(-15vw,14vh)}50%{transform:translate(-18vw,28vh)}75%{transform:translate(-6vw,16vh)}100%{transform:translate(0,0)}}

   NXT BLD 2026 — custom layouts for sync_gslides slide build

/* [ALT] badge — for alternative slides per VERBATIM-rule directive */
.alt-badge{position:absolute;top:18px;right:22px;z-index:5;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:rgba(245,158,11,.9);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.4);padding:5px 12px;border-radius:4px;backdrop-filter:blur(8px)}
.slide.is-alt{box-shadow:inset 0 0 0 1px rgba(245,158,11,.15)}

/* Cover cycle animation (slide 1 — NOTE directive) */
.cover-cycle-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;opacity:.32;pointer-events:none}
.cover-cycle{width:min(78vh,78vw);height:min(78vh,78vw);max-width:840px;max-height:840px}
.cycle-rotor{animation:cycleRotate 36s linear infinite;transform-origin:center;transform-box:fill-box}
.cycle-arrow{animation:cycleArrowOrbit 8s ease-in-out infinite;transform-origin:center}
.cycle-pulse{animation:cyclePulse 4.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.cycle-icon{animation:cycleIconFade 8s ease-in-out infinite}
/* Inner counter-rotation keeps each icon upright while it orbits with the rotor */
.cycle-icon-inner{animation:cycleCounterRotate 36s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes cycleCounterRotate{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.cycle-icon:nth-child(2){animation-delay:0s}
.cycle-icon:nth-child(3){animation-delay:1.33s}
.cycle-icon:nth-child(4){animation-delay:2.66s}
.cycle-icon:nth-child(5){animation-delay:4s}
.cycle-icon:nth-child(6){animation-delay:5.33s}
.cycle-icon:nth-child(7){animation-delay:6.66s}
@keyframes cycleRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes cycleArrowOrbit{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
@keyframes cyclePulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes cycleIconFade{0%,100%{opacity:.45;filter:none}50%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}}
/* Push cover talk-title above the cycle ring; brighten gradient + slow shimmer */
.slide[data-type="cover"] .event-tag,.slide[data-type="cover"] .talk-title,.slide[data-type="cover"] .talk-subtitle,.slide[data-type="cover"] .speaker-card{position:relative;z-index:2}
.slide[data-type="cover"] .talk-title{font-size:clamp(3.2rem,8vw,8.5rem);line-height:1;background:linear-gradient(130deg,#fff 4%,#fff 30%,#a5d8ff 55%,#c5b6ff 80%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleShimmer 9s ease-in-out infinite}
@keyframes titleShimmer{0%,100%{background-position:0% 50%;filter:brightness(1)}50%{background-position:100% 50%;filter:brightness(1.12) drop-shadow(0 0 30px rgba(165,216,255,.35))}}
/* Cover logo — bulletproof horizontal centering (left:0;right:0;margin:auto) */
.cover-logo-wrap{position:absolute;bottom:clamp(28px,4vh,56px);left:0;right:0;margin:0 auto;width:max-content;opacity:.55;z-index:2;pointer-events:none;text-align:center}
.cover-logo-wrap img{width:clamp(180px,18vw,260px);height:auto;display:block;margin:0 auto;filter:brightness(0) invert(1)}

/* Agenda list — bigger text + animated cycling markers (reinforces the cycle metaphor) */
.agenda-list{list-style:none;padding:0;margin:24px 0 0;text-align:left;display:inline-block}
.agenda-list li{padding:14px 0 14px 56px;position:relative;font-size:clamp(1.35rem,2.1vw,1.85rem);color:rgba(240,244,255,.92);line-height:1.4;font-weight:500;letter-spacing:-.005em}
/* Outer pulsing ring */
.agenda-list li::before{content:'';position:absolute;left:6px;top:50%;width:30px;height:30px;margin-top:-15px;border:1.6px solid var(--teal);border-radius:50%;opacity:.55;animation:agendaBulletPulse 2.4s ease-in-out infinite}
/* Orbiting dot — the "cycle" element */
.agenda-list li::after{content:'';position:absolute;left:21px;top:50%;width:6px;height:6px;margin-top:-3px;background:var(--teal);border-radius:50%;box-shadow:0 0 8px var(--teal);animation:agendaBulletOrbit 5s linear infinite;transform-origin:0 0}
.agenda-list li:nth-child(2)::before,.agenda-list li:nth-child(2)::after{animation-delay:-.4s}
.agenda-list li:nth-child(3)::before,.agenda-list li:nth-child(3)::after{animation-delay:-.8s}
.agenda-list li:nth-child(4)::before,.agenda-list li:nth-child(4)::after{animation-delay:-1.2s}
.agenda-list li:nth-child(5)::before,.agenda-list li:nth-child(5)::after{animation-delay:-1.6s}
.agenda-list li:nth-child(6)::before,.agenda-list li:nth-child(6)::after{animation-delay:-2.0s}
.agenda-list li:nth-child(7)::before,.agenda-list li:nth-child(7)::after{animation-delay:-2.4s}
.agenda-list li:nth-child(8)::before,.agenda-list li:nth-child(8)::after{animation-delay:-2.8s}
@keyframes agendaBulletPulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.18);opacity:.95}}
@keyframes agendaBulletOrbit{from{transform:rotate(0deg) translateX(11px)}to{transform:rotate(360deg) translateX(11px)}}
@keyframes agendaReveal{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.slide.active .agenda-list li{animation:agendaReveal .45s ease forwards;opacity:0}
.slide.active .agenda-list li:nth-child(1){animation-delay:.08s}.slide.active .agenda-list li:nth-child(2){animation-delay:.25s}.slide.active .agenda-list li:nth-child(3){animation-delay:.42s}.slide.active .agenda-list li:nth-child(4){animation-delay:.59s}.slide.active .agenda-list li:nth-child(5){animation-delay:.76s}.slide.active .agenda-list li:nth-child(6){animation-delay:.93s}.slide.active .agenda-list li:nth-child(7){animation-delay:1.10s}.slide.active .agenda-list li:nth-child(8){animation-delay:1.27s}
.layout-orbit{padding:0!important;align-items:stretch!important;justify-content:stretch!important}.orbit-stage{position:absolute;inset:0}
/* layout:'big' subtitle nudge — agenda has none so this just keeps spacing right */
.case-slide.layout-big .big-eyebrow{font-size:clamp(2.6rem,5vw,4.2rem)}

/* Intro-hxr — duo intro port from FMX/HXR. Two pixel-art walkers (Alex + Jun)
   walk in, jump, grab VR headsets, power up. Then bio + stats reveal. */
.layout-intro-hxr{padding:0!important}
.intro-grid{display:flex;align-items:center;gap:clamp(40px,5vw,90px);width:100%;max-width:1500px;padding:clamp(50px,5vw,90px) clamp(60px,7vw,140px)}
.intro-stage{flex:0 0 42%;max-width:560px;aspect-ratio:1/1;position:relative}
.intro-stage svg{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.intro-content{flex:1;text-align:left}
.intro-eyebrow{font-size:clamp(.78rem,1.1vw,1rem);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:18px}
.intro-title{font-size:clamp(2.6rem,5.5vw,5.2rem);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin-bottom:24px;background:linear-gradient(130deg,#fff 20%,#a5d8ff 55%,#c5b6ff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.intro-sub{font-size:clamp(1rem,1.5vw,1.3rem);color:var(--dim);line-height:1.55;margin-bottom:24px;max-width:640px}
.intro-duo-names{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;font-size:clamp(.9rem,1.2vw,1.1rem);color:rgba(240,244,255,.92)}
.intro-duo-name em{font-style:italic;color:var(--dim);font-size:.92em}
.intro-duo-name .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.intro-duo-name .dot-alex{background:#6a8fd6;color:#6a8fd6}
.intro-duo-name .dot-jun{background:#a78bfa;color:#a78bfa}
.intro-stats{display:flex;gap:14px;flex-wrap:nowrap}
.intro-stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 18px;flex:1;min-width:0}
.intro-stat .num{display:block;font-size:clamp(1.4rem,2.2vw,2rem);font-weight:700;color:var(--teal);letter-spacing:-.02em;margin-bottom:6px}
.intro-stat .lbl{display:block;font-size:clamp(.6rem,.82vw,.76rem);font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);line-height:1.3}
.intro-stage .stage-floor{fill:rgba(0,212,255,.10);stroke:rgba(0,212,255,.28);stroke-width:1}
.intro-stage .stage-walker{transform-origin:center bottom}
/* Per-walker walk paths — Alex from left, Jun from right (mirrored) */
@keyframes introWalkAlex{0%{transform:translate(-220px,0)}100%{transform:translate(60px,0)}}
@keyframes introJumpAlex{0%{transform:translate(60px,0) scale(1,1)}30%{transform:translate(60px,-16px) scale(.95,1.05)}100%{transform:translate(60px,-80px) scale(1,1)}}
@keyframes introFallDownAlex{0%{transform:translate(60px,-80px) scale(1.4)}100%{transform:translate(60px,0) scale(1.4)}}
@keyframes introPowerUpAlex{0%{transform:translate(60px,-80px) scale(1);filter:brightness(1)}35%{transform:translate(60px,-80px) scale(1.2);filter:brightness(1.8)}60%{transform:translate(60px,-80px) scale(1.1);filter:brightness(1.3)}100%{transform:translate(60px,-80px) scale(1.4);filter:brightness(1)}}
@keyframes introWalkJun{0%{transform:translate(220px,0)}100%{transform:translate(-60px,0)}}
@keyframes introJumpJun{0%{transform:translate(-60px,0) scale(1,1)}30%{transform:translate(-60px,-16px) scale(.95,1.05)}100%{transform:translate(-60px,-80px) scale(1,1)}}
@keyframes introFallDownJun{0%{transform:translate(-60px,-80px) scale(1.4)}100%{transform:translate(-60px,0) scale(1.4)}}
@keyframes introPowerUpJun{0%{transform:translate(-60px,-80px) scale(1);filter:brightness(1)}35%{transform:translate(-60px,-80px) scale(1.2);filter:brightness(1.8)}60%{transform:translate(-60px,-80px) scale(1.1);filter:brightness(1.3)}100%{transform:translate(-60px,-80px) scale(1.4);filter:brightness(1)}}
@keyframes introHeadsetBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes introHeadsetGrab{0%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(1.3) translateY(-8px)}100%{opacity:0;transform:scale(0) translateY(-24px)}}
@keyframes introSparkle{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:1;transform:translate(calc(var(--tx)*.15),calc(var(--ty)*.15)) scale(1.5)}55%{opacity:1;transform:translate(calc(var(--tx)*.6),calc(var(--ty)*.6)) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3)}}
@keyframes introFlash{0%{opacity:0}8%{opacity:.7}100%{opacity:0}}
@keyframes ue5BoxFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes ue5BoxFadeIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes ue5BoxExplode{0%{opacity:1;transform:scale(1)}40%{opacity:1;transform:scale(1.8);filter:brightness(2.2)}100%{opacity:0;transform:scale(2.6);filter:brightness(3)}}
@media(max-width:900px){.intro-grid{flex-direction:column;text-align:center;padding:30px 20px}.intro-stage{width:80%;max-width:340px}.intro-content{text-align:center}.intro-stats{flex-wrap:wrap}}

/* Secret Graveyard collage */
.sg-collage-stage{position:absolute;inset:0;padding:80px 60px 40px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:10px}
.sg-tile{position:relative;overflow:hidden;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(244,63,94,.18);transform:rotate(var(--r,0deg));animation:sgFloat 8s ease-in-out infinite}
.sg-tile:nth-child(odd){--r:-1.5deg}
.sg-tile:nth-child(even){--r:1.2deg}
.sg-tile:nth-child(3n){animation-delay:1.2s}
.sg-tile:nth-child(3n+1){animation-delay:2.4s}
.sg-tile img,.sg-tile video{width:100%;height:100%;object-fit:cover;opacity:.85;filter:saturate(.85)}
.sg-tile-0{grid-column:span 2}
.sg-tile-2{grid-row:span 2}
.sg-tile-4{grid-column:span 2}
.sg-tile-7{grid-row:span 2}
.sg-tile-fill-tr{grid-column:6;grid-row:1}
.sg-sticky{position:absolute;background:rgba(245,200,30,.92);color:#1a1a1a;font-family:'Caveat',cursive,system-ui;font-weight:700;font-size:clamp(.85rem,1.5vw,1.4rem);padding:8px 14px;border-radius:2px;transform:rotate(var(--r,-3deg));box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:3;pointer-events:none}
.sg-sticky-0{top:10%;left:8%;--r:-4deg}
.sg-sticky-1{top:48%;right:6%;--r:3deg}
.sg-sticky-2{bottom:18%;left:12%;--r:-2deg}
.sg-sticky-3{top:14%;right:30%;--r:2.5deg;background:rgba(244,63,94,.92);color:#fff}
.sg-overlay{background:linear-gradient(180deg,rgba(6,8,16,.95) 0%,rgba(6,8,16,.7) 70%,transparent 100%);padding:20px 30px 50px!important;top:0!important;bottom:auto!important}
@keyframes sgFloat{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(var(--r,0deg)) translateY(-6px)}}

/* Secret Graveyard fragments — typography slide */
.sg-frag-stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;gap:40px}
.sg-frag-title{font-size:clamp(1.6rem,3vw,2.6rem);color:rgba(240,244,255,.8);font-weight:600;letter-spacing:-.01em;text-align:center;max-width:1100px}
.sg-frag-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,500px));gap:clamp(20px,2.5vw,40px);justify-content:center}
.sg-frag{font-family:'Courier New',monospace;font-size:clamp(1.4rem,3vw,2.4rem);font-weight:700;color:rgba(244,63,94,.95);padding:18px 28px;background:rgba(244,63,94,.06);border-left:4px solid rgba(244,63,94,.6);border-radius:0 4px 4px 0;text-align:left}
/* Each fragment gets a distinct accent + tilt for visual variety */
.sg-frag-0{transform:rotate(-1.2deg);color:rgba(244,63,94,.96);border-left-color:rgba(244,63,94,.7);background:rgba(244,63,94,.08)}
.sg-frag-1{transform:rotate(.9deg);color:rgba(245,158,11,.96);border-left-color:rgba(245,158,11,.7);background:rgba(245,158,11,.08)}
.sg-frag-2{transform:rotate(-.7deg);color:rgba(0,212,255,.96);border-left-color:rgba(0,212,255,.7);background:rgba(0,212,255,.08)}
.sg-frag-3{transform:rotate(1.4deg);color:rgba(167,139,250,.96);border-left-color:rgba(167,139,250,.7);background:rgba(167,139,250,.08)}
.sg-frag-punch{font-size:clamp(1.4rem,2.5vw,2.2rem);font-weight:700;color:#f0f4ff;text-align:center;margin-top:20px;letter-spacing:-.01em}

/* Pattern cycle diagram (slide 23) */
.pattern-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 40px;gap:24px}
.pattern-eyebrow{font-size:clamp(1.6rem,3vw,2.6rem);color:#f0f4ff;font-weight:700;letter-spacing:-.01em;text-align:center}
.pattern-svg{width:min(90vw,1100px);height:auto;max-height:65vh}
.pattern-caption{font-size:clamp(1rem,1.4vw,1.25rem);color:rgba(240,244,255,.7);text-align:center;font-style:italic;max-width:900px}
.pat-node{animation:patNodeFade 6s ease-in-out infinite}
.pat-node:nth-child(2){animation-delay:0s}
.pat-node:nth-child(3){animation-delay:1.5s}
.pat-node:nth-child(4){animation-delay:3s}
.pat-node:nth-child(5){animation-delay:4.5s}
.pat-node:nth-child(6){animation-delay:6s}
.pat-node:nth-child(7){animation-delay:7.5s}
.pat-node-final{animation:patNodePulseRose 1.3s ease-in-out infinite}
@keyframes patNodeFade{0%,100%{opacity:.75}25%{opacity:1}}
@keyframes patNodePulseRose{0%,100%{opacity:.85;filter:drop-shadow(0 0 6px rgba(244,63,94,.5))}50%{opacity:1;filter:drop-shadow(0 0 22px rgba(244,63,94,1)) drop-shadow(0 0 50px rgba(244,63,94,.8)) drop-shadow(0 0 90px rgba(244,63,94,.45))}}
/* UE5 blueprint pulse — per-color node glows */
.pat-node-purple{animation:patNodePulsePurple 1.6s ease-in-out infinite}
.pat-node-amber{animation:patNodePulseAmber 1.5s ease-in-out infinite}
.pat-node-teal{animation:patNodePulseTeal 1.7s ease-in-out infinite}
@keyframes patNodePulsePurple{0%,100%{filter:drop-shadow(0 0 4px rgba(167,139,250,.35))}50%{filter:drop-shadow(0 0 16px rgba(167,139,250,1)) drop-shadow(0 0 36px rgba(167,139,250,.65)) drop-shadow(0 0 60px rgba(167,139,250,.3))}}
@keyframes patNodePulseAmber{0%,100%{filter:drop-shadow(0 0 4px rgba(245,158,11,.35))}50%{filter:drop-shadow(0 0 16px rgba(245,158,11,1)) drop-shadow(0 0 36px rgba(245,158,11,.65)) drop-shadow(0 0 60px rgba(245,158,11,.3))}}
@keyframes patNodePulseTeal{0%,100%{filter:drop-shadow(0 0 4px rgba(0,212,255,.35))}50%{filter:drop-shadow(0 0 16px rgba(0,212,255,1)) drop-shadow(0 0 36px rgba(0,212,255,.65)) drop-shadow(0 0 60px rgba(0,212,255,.3))}}
/* flowing dash on connector paths */
@keyframes patFlowDash{to{stroke-dashoffset:-40}}
.pat-flow{animation:patFlowDash 1.6s linear infinite}
.pat-flow-dash{animation:patFlowDash 2.2s linear infinite}

/* Trilogy slide — 2-up cards of prior NXT BLD talks (slide 6) */
.layout-trilogy{padding:0!important}
.trilogy-stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(36px,5vh,64px) clamp(40px,5vw,90px);gap:clamp(18px,2.5vh,32px)}
.trilogy-head{text-align:center;flex-shrink:0}
.trilogy-title{font-size:clamp(2rem,3.8vw,3.2rem);font-weight:700;color:#f0f4ff;letter-spacing:-.015em;line-height:1.1;margin-bottom:8px}
.trilogy-sub{font-size:clamp(.95rem,1.3vw,1.2rem);color:rgba(240,244,255,.65);font-style:italic}
.trilogy-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,2.5vw,40px);min-height:0}
.trilogy-card{display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(0,212,255,.25);border-radius:14px;padding:clamp(14px,1.5vw,22px);min-height:0;overflow:hidden;text-decoration:none;color:inherit;transition:transform .25s,border-color .25s}
.trilogy-card:hover{transform:translateY(-4px);border-color:rgba(0,212,255,.55)}
.trilogy-thumb{flex:1;min-height:0;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.4);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.trilogy-thumb img{width:100%;height:100%;object-fit:cover}
.trilogy-meta{flex-shrink:0}
.trilogy-year{font-size:clamp(.7rem,.95vw,.85rem);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.trilogy-tname{font-size:clamp(.95rem,1.4vw,1.25rem);font-weight:600;color:#f0f4ff;line-height:1.32}
.trilogy-qr-row{display:flex;align-items:center;gap:14px;flex-shrink:0;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);flex-direction:row-reverse}
.trilogy-qr{width:clamp(100px,8vw,140px);height:auto;background:#fff;padding:5px;border-radius:6px;flex-shrink:0}
.trilogy-qr-cap{font-size:clamp(.78rem,1vw,.95rem);color:rgba(240,244,255,.65);font-style:italic;line-height:1.35;text-align:right}
@media(max-width:900px){.trilogy-grid{grid-template-columns:1fr}.trilogy-thumb{aspect-ratio:16/9}}

/* Toolbox grid (slide 25) — 4 product cards */
.toolbox-stage{position:absolute;inset:0;padding:80px 50px 40px;display:flex;flex-direction:column;align-items:center;gap:28px}
.toolbox-title{font-size:clamp(1.6rem,2.8vw,2.4rem);color:#f0f4ff;font-weight:700;text-align:center;letter-spacing:-.01em}
.toolbox-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;width:100%;max-width:1500px;min-height:0}
.toolbox-card{background:rgba(255,255,255,.04);border:1px solid rgba(167,139,250,.25);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,border-color .3s;overflow:hidden;min-height:0}
.toolbox-card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,.6)}
.toolbox-img{flex:none;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.4)}
.toolbox-img img,.toolbox-img video{width:100%;height:100%;object-fit:cover;object-position:center top}
.toolbox-name{font-size:clamp(.95rem,1.3vw,1.2rem);font-weight:700;color:#f0f4ff}
.toolbox-q{font-size:clamp(.8rem,1.05vw,.95rem);color:rgba(167,139,250,.95);font-style:italic;line-height:1.35}
/* Toolbox-morph substep — cards fly INTO an actual toolbox */
.toolbox-morph-mode .toolbox-title{opacity:0;transition:opacity .5s}
.toolbox-card.tb-flying{transition:transform .65s cubic-bezier(.5,-.2,.6,1.4),opacity .5s ease;pointer-events:none;z-index:5}
.toolbox-card.tb-gone{opacity:0;transform:translate(var(--tbx,0),var(--tby,420px)) scale(.05) rotate(var(--tbr,8deg))}
.toolbox-icon{position:absolute;left:50%;bottom:10%;transform:translate(-50%,40%) scale(.6);opacity:0;width:520px;height:340px;pointer-events:none;z-index:3;transition:transform .55s cubic-bezier(.2,.8,.3,1.1),opacity .5s}
.toolbox-morph-mode .toolbox-icon{transform:translate(-50%,0) scale(1);opacity:1}
.toolbox-icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55))}
.toolbox-icon .tb-lid{transform-origin:50% 78px;transform:rotate(0deg);transition:transform .5s cubic-bezier(.3,.9,.4,1.2)}
.toolbox-morph-mode .toolbox-icon .tb-lid{transform:rotate(-22deg)}
.tb-handle{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .5s cubic-bezier(.34,1.56,.64,1) .15s}
.toolbox-morph-mode .toolbox-icon .tb-handle{transform:scaleY(1)}
.toolbox-chip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(40px) scale(.5);opacity:0;background:rgba(8,12,24,.92);border:1.5px solid currentColor;border-radius:999px;padding:14px 26px 14px 22px;display:flex;flex-direction:column;gap:4px;min-width:280px;max-width:360px;pointer-events:none;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset;transition:transform .55s cubic-bezier(.2,.8,.2,1.3),opacity .45s}
.toolbox-chip.in{opacity:1}
.toolbox-chip .tc-name{font-size:1.55rem;font-weight:700;color:#f0f4ff;letter-spacing:.02em;line-height:1.1}
.toolbox-chip .tc-q{font-size:1.05rem;font-style:italic;color:rgba(240,244,255,.72);line-height:1.2}

{const _OAC=window.AudioContext||window.webkitAudioContext;const _PAC=function(...a){const c=new _OAC(...a);_activeAudioCtxs.add(c);const oc=c.close.bind(c);c.close=function(){_activeAudioCtxs.delete(c);return oc();};return c;};_PAC.prototype=_OAC.prototype;window.AudioContext=_PAC;if(window.webkitAudioContext)window.webkitAudioContext=_PAC;}

function playToolboxThud(){try{const c=sfxCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(70,t+.09);lp.type='lowpass';lp.frequency.value=420;o.connect(lp);lp.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.18,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.start(t);o.stop(t+.14);}catch(e){}}

(function(){

      }).join('');
      const overlay=(c.title||c.bigText||c.bigCaption)?`<div class="asset-belt-overlay">${c.title?`<h2 class="big-eyebrow">${c.title}</h2>`:''}${c.bigText?`<h1 class="big-text">${c.bigText.replace(/\n/g,'<br>')}</h1>`:''}${c.bigCaption?`<div class="big-caption">${c.bigCaption}</div>`:''}</div>`:'';

        let beltAnim=null,lastAnim=null,ovlAnim=null;
        const run=()=>{

        items=c.placedImages.map(([src,l,t,w,h,op])=>{const tag=_mt(src);const st=op?tag.replace(/>$/,` style="object-position:${op}">`):tag;return `<div class="placed-item" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%">${st}</div>`;}).join('');

          }
          if(it.type==='text'){
            const plainCls=it.plain?' placed-text--plain':'';
            return `<div class="placed-item placed-text${plainCls}" ${st}${(it.fadeOrder!=null)?` data-fade-order="${it.fadeOrder}"`:''}><div class="placed-text-inner">${it.heading?`<h3 class="placed-text-h">${it.heading}</h3>`:''}${it.bullets?`<ul class="placed-text-list">${it.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:(it.html||'')}</div></div>`;

          if(it.type==='mp4'||(it.src&&(it.src.endsWith('.mp4')||it.src.endsWith('.webm')))){

            const rate=it.rate?` data-rate="${it.rate}"`:'';
            return `<div class="placed-item" ${st}${fo}><video src="${it.src}" autoplay loop muted playsinline${rate}></video>${lbl}</div>`;
          }
          const lbl=it.label?`<div class="placed-item-label">${it.label}</div>`:'';
          return `<div class="placed-item" ${st}${fo}><img src="${it.src}" loading="lazy">${lbl}</div>`;
        }).join('');
      }
      const head=(c.title||c.subtitle)?`<div class="placed-overlay">${c.title?`<h3 class="placed-title">${c.title.replace(/\n/g,'<br>')}</h3>`:''}${c.subtitle?`<p class="placed-sub">${c.subtitle}</p>`:''}</div>`:'';
      s.innerHTML=`<div class="placed-stage">${items}</div>${head}${altBadge}`;

      const iframeSrc=c.img.slice(7);
      imgHTML=`<iframe src="${iframeSrc}" style="width:100%;height:100%;border:none;border-radius:18px" allow="autoplay;fullscreen;xr-spatial-tracking" allowfullscreen></iframe>`;

// 3D Monocle on Bonus slide
(function(){
  const container=document.createElement('div');
  container.style.cssText='position:absolute;left:75.7%;top:30.2%;width:300px;height:300px;pointer-events:auto;z-index:2';
  bon.appendChild(container);
  const canvas=document.createElement('canvas');
  canvas.width=600;canvas.height=600;
  canvas.style.cssText='width:100%;height:100%;cursor:grab';
  canvas.style.transformBox='fill-box';canvas.style.transformOrigin='center center';canvas.style.transform='scale(0.57)';
  container.appendChild(canvas);
  let running=false,renderer,scene,camera,group,rafId;
  let isDragging=false,prevMouse={x:0,y:0},autoRotate=true,resumeTimer;
  async function init(){
    if(running)return;
    const THREE=await import('three');

    camera=new THREE.PerspectiveCamera(40,1,0.1,100);
    camera.position.set(0,0,8);
    renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    renderer.setSize(600,600);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    // Lights
    scene.add(new THREE.AmbientLight(0x8888cc,0.5));
    const dLight=new THREE.DirectionalLight(0xffffff,1.2);
    dLight.position.set(5,5,5);scene.add(dLight);
    const pLight=new THREE.PointLight(0x00d4ff,0.3);
    pLight.position.set(0,0,2.5);scene.add(pLight);

    const ringMat=new THREE.MeshStandardMaterial({color:0xf59e0b,metalness:0.7,roughness:0.3});
    const lensMat=new THREE.MeshStandardMaterial({color:0x00d4ff,transparent:true,opacity:0.15,metalness:0.1,roughness:0.4,side:THREE.DoubleSide});
    const cordMat=new THREE.MeshStandardMaterial({color:0xd97706,metalness:0.6,roughness:0.35});

    group=new THREE.Group();
    // Torus (monocle ring)
    const torus=new THREE.Mesh(new THREE.TorusGeometry(2,0.15,24,64),ringMat);
    group.add(torus);
    // Lens disc
    const lens=new THREE.Mesh(new THREE.CircleGeometry(1.85,48),lensMat);
    group.add(lens);
    // Cord curve
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,-2,0),
      new THREE.Vector3(-0.6,-2.8,0.3),
      new THREE.Vector3(-1.2,-3.5,0.1),
      new THREE.Vector3(-1.0,-4.2,-0.2)

    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.06,8,false),cordMat);
    group.add(tube);
    // Eyepiece sphere
    const eyepiece=new THREE.Mesh(new THREE.SphereGeometry(0.18,16,16),cordMat);

    group.add(eyepiece);

    canvas.addEventListener('touchstart',onTouchDown,{passive:false});
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onTouchMove,{passive:false});

      if(autoRotate){
        group.rotation.y+=0.005;
        group.rotation.x=baseX+Math.sin(Date.now()*0.0008)*0.15;
      } else {
        baseX=group.rotation.x;
      }
      renderer.render(scene,camera);
      rafId=requestAnimationFrame(animate);
    }
    rafId=requestAnimationFrame(animate);
  }
  function onDown(e){isDragging=true;prevMouse={x:e.clientX,y:e.clientY};canvas.style.cursor='grabbing';autoRotate=false;clearTimeout(resumeTimer);}
  function onTouchDown(e){if(e.touches.length===1){e.preventDefault();isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};autoRotate=false;clearTimeout(resumeTimer);}}
  function onMove(e){if(!isDragging||!group)return;const dx=e.clientX-prevMouse.x,dy=e.clientY-prevMouse.y;group.rotation.y+=dx*0.01;group.rotation.x+=dy*0.01;prevMouse={x:e.clientX,y:e.clientY};}
  function onTouchMove(e){if(!isDragging||!group||e.touches.length!==1)return;e.preventDefault();const dx=e.touches[0].clientX-prevMouse.x,dy=e.touches[0].clientY-prevMouse.y;group.rotation.y+=dx*0.01;group.rotation.x+=dy*0.01;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}

    window.removeEventListener('touchend',onUp);

let _introAudioCtx=null;

function playTallyChing(){try{if(!_tallyAudioCtx)_tallyAudioCtx=new(window.AudioContext||window.webkitAudioContext)();const ctx=_tallyAudioCtx;if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;[[1047,0,.18],[1319,.05,.18],[1568,.1,.25]].forEach(([f,s,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.06,now+s);g.gain.exponentialRampToValueAtTime(.001,now+s+d);o.connect(g);g.connect(ctx.destination);o.start(now+s);o.stop(now+s+d+.01);});}catch(e){}}
function animateTally(el){
  const orig=el.dataset.tally||el.textContent.trim();el.dataset.tally=orig;
  const m=orig.match(/^(\d+)(\+?)$/);if(!m)return;
  const target=parseInt(m[1],10),suffix=m[2]||'',dur=1000,start=performance.now();
  el.style.display='inline-block';el.style.willChange='transform';
  let _last=-1;
  function frame(t){const k=Math.min(1,(t-start)/dur),eased=1-Math.pow(1-k,3),cur=Math.round(eased*target);
    el.textContent=cur+(k>=1?suffix:'');
    if(cur!==_last&&k<1){playTallyTick();_last=cur;}
    let y=0,sx=1,sy=1;
    if(k<.85){y=-Math.sin((k/.85)*Math.PI)*14;}
    else{const lk=(k-.85)/.15;sy=1-.12*Math.sin(lk*Math.PI);sx=1+.12*Math.sin(lk*Math.PI);}
    el.style.transform=`translateY(${y.toFixed(2)}px) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    if(k<1)requestAnimationFrame(frame);else{el.style.transform='';playTallyChing();}}
  requestAnimationFrame(frame);
}

// Web-Audio zap SFX for fireball bursts (ported from FMX)
let _fbAudioCtx=null;
function playZapSfx(){
  try{if(!_fbAudioCtx)_fbAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ctx=_fbAudioCtx;if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(200,now+.15);
  o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.15);
  o.start(now);o.stop(now+.15);}catch(e){}
}

// UE5 fireball projectile — random pick of GoldAuthorized.png or ue5logo.png
function shootFireball(svg,startX,startY,dir){
  const fb=svgE('g',{transform:`translate(${startX},${startY})`});
  const isGold=Math.random()<.5;
  fb.appendChild(svgE('image',{href:isGold?'GoldAuthorized.png':'ue5logo.png',x:-20,y:-20,width:40,height:40}));
  svg.appendChild(fb);
  playZapSfx();
  let frame=0;const speed=dir*5.5;
  const spin=()=>{frame++;const cx=startX+speed*frame;
    const bounce=-Math.abs(Math.sin(frame*.12))*18*Math.max(0,1-frame/40);
    fb.setAttribute('transform',`translate(${cx},${startY+bounce}) rotate(${frame*12})`);
    if(frame<55&&cx>5&&cx<395)requestAnimationFrame(spin);else fb.remove();};
  requestAnimationFrame(spin);
}

(function(){

    const tbx=document.createElement('div');tbx.className='toolbox-icon';
    tbx.innerHTML='<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">'+
      // handle — base sits on lid top (y=64); springs up via .tb-handle CSS on morph
      '<g class="tb-handle"><rect x="120" y="54" width="60" height="12" rx="3" fill="none" stroke="#0e1530" stroke-width="3"/><path d="M118 64 Q150 28 182 64" fill="none" stroke="#f0f4ff" stroke-width="3" stroke-linecap="round" opacity=".85"/></g>'+

      '<rect x="56" y="106" width="188" height="14" rx="3" fill="rgba(0,212,255,.12)" stroke="rgba(0,212,255,.35)" stroke-width="1"/>'+
      // latches
      '<rect x="56" y="128" width="22" height="14" rx="2" fill="#f59e0b" opacity=".9"/>'+
      '<rect x="222" y="128" width="22" height="14" rx="2" fill="#f59e0b" opacity=".9"/>'+
      // baseline shadow
      '<ellipse cx="150" cy="186" rx="120" ry="6" fill="rgba(0,0,0,.45)"/>'+
      '</svg>';
    stage.appendChild(tbx);
    // Tagline
    const tag=document.createElement('div');tag.className='toolbox-tagline';
    tag.innerHTML='Same toolbox. <em>Different questions.</em>';
    stage.appendChild(tag);
    // Pre-build chips (hidden), one per product. Color order matches SECTIONS.
    const palette=['c-amber','c-teal','c-rose','c-purple'];
    const cards=Array.from(tbSlide.querySelectorAll('.toolbox-card'));
    const chips=cards.map(function(card,i){
      const name=card.querySelector('.toolbox-name')?.textContent||'';
      const q=card.querySelector('.toolbox-q')?.textContent||'';
      const chip=document.createElement('div');chip.className='toolbox-chip '+palette[i];
      chip.innerHTML='<div class="tc-name">'+name+'</div><div class="tc-q">'+q+'</div>';
      stage.appendChild(chip);
      return chip;
    });
    // Chip target positions: fan above the toolbox (relative to slide center)
    // toolbox sits at left:50% bottom:8% with width 300. Chips fan around upper rim.
    const chipPos=[
      {x:-460,y:110},  // far-left
      {x:-240,y:-130}, // upper-left
      {x: 240,y:-130}, // upper-right
      {x: 460,y:110}   // far-right
    ];
    function flyCardToBox(card,delay){
      // Compute card centre vs slide centre to derive flight delta
      const sR=stage.getBoundingClientRect();
      const cR=card.getBoundingClientRect();
      // Toolbox opening is roughly center of stage, bottom ~75% down
      const targetX=sR.left+sR.width/2;
      const targetY=sR.top+sR.height*0.78;
      const dx=targetX-(cR.left+cR.width/2);
      const dy=targetY-(cR.top+cR.height/2);
      const rot=(Math.random()*16-8).toFixed(1)+'deg';
      card.style.setProperty('--tbx',dx.toFixed(0)+'px');
      card.style.setProperty('--tby',dy.toFixed(0)+'px');
      card.style.setProperty('--tbr',rot);
      setTimeout(function(){
        card.classList.add('tb-flying','tb-gone');
        try{playToolboxThud();}catch(e){}
      },delay);
    }
    function popChip(chip,i,delay){
      const p=chipPos[i];
      setTimeout(function(){
        chip.style.transform='translate(-50%,-50%) translate('+p.x+'px,'+p.y+'px) scale(1)';
        chip.classList.add('in');
      },delay);
    }
    function step1(){
      stage.classList.add('toolbox-morph-mode');
      stage.style.transform='translate(2px,10px)';
      const _grid=stage.querySelector('.toolbox-grid');if(_grid)_grid.style.transform='translate(19px,182px)';
      // Toolbox grows in immediately (CSS). Then stagger card flights + chip pops.
      cards.forEach(function(card,i){
        const baseDelay=350+i*180;
        flyCardToBox(card,baseDelay);
        // Chip pops up just as card "lands" in toolbox
        popChip(chips[i],i,baseDelay+380);
      });
    }
    function resetToolboxMorph(){
      stage.classList.remove('toolbox-morph-mode');
      stage.style.transform='';
      const _grid=stage.querySelector('.toolbox-grid');if(_grid)_grid.style.transform='';
      cards.forEach(function(card){
        card.classList.remove('tb-flying','tb-gone');
        card.style.removeProperty('--tbx');card.style.removeProperty('--tby');card.style.removeProperty('--tbr');
      });
      chips.forEach(function(chip){
        chip.classList.remove('in');
        chip.style.transform='';
      });
    }
    slideSteps.set(tbSlide,{current:0,steps:[step1],reset:resetToolboxMorph});
  },0);
})();

(function(){const bar=document.createElement('div');bar.id='anim-scrub-bar';bar.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:1100;display:none;align-items:center;gap:10px;background:rgba(6,8,16,.92);border:1px solid rgba(245,158,11,.4);border-radius:10px;padding:10px 14px;backdrop-filter:blur(10px);font-family:var(--font);font-size:.7rem;color:var(--amber)';bar.innerHTML=`<button id="scrub-replay" style="background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.4);border-radius:5px;padding:5px 10px;font:inherit;cursor:pointer">Replay</button><button id="scrub-pp" style="background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.4);border-radius:5px;padding:5px 10px;font:inherit;cursor:pointer;width:70px">Pause</button><div id="scrub-track" style="position:relative;width:360px;height:28px;display:flex;align-items:center"><input id="scrub-r" type="range" min="0" max="5000" value="0" step="10" style="width:100%;accent-color:var(--amber);position:relative;z-index:2"><div id="kf-markers" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1"></div></div><span id="scrub-t" style="min-width:60px;text-align:right;color:rgba(245,158,11,.8)">0 ms</span><button id="kf-set" title="Set keyframe for last-moved element at current time" style="background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.4);border-radius:5px;padding:5px 8px;font:inherit;cursor:pointer">◆ KF</button><button id="kf-del" title="Delete keyframe at current time" style="background:rgba(244,63,94,.15);color:var(--rose);border:1px solid rgba(244,63,94,.4);border-radius:5px;padding:5px 8px;font:inherit;cursor:pointer;display:none">✕ KF</button>`;document.body.appendChild(bar);const rng=bar.querySelector('#scrub-r'),tl=bar.querySelector('#scrub-t'),pp=bar.querySelector('#scrub-pp'),rp=bar.querySelector('#scrub-replay');let paused=false;function sa(){const s // ── Keyframe animation system ──
(function(){
  const kfStore=new Map(),kfAnims=new Map();
  const markers=document.getElementById('kf-markers'),delBtn=document.getElementById('kf-del'),setBtn=document.getElementById('kf-set');
  setBtn?.addEventListener('click',()=>{
    if(!_lastMoveEl){annoToast('Move an element first, then click ◆ KF');return;}
    const xform=gX(_lastMoveEl);
    window.kfAddKeyframe(_lastMoveEl,xform);
  });

  window._kfUpdateDel=function(time){
    let has=false;
    kfStore.forEach(kfs=>{if(kfs.some(k=>k.slide===current&&Math.abs(k.time-time)<20))has=true;});
    delBtn.style.display=has?'inline-block':'none';
  };

  window._kfRenderMarkers=function(){
    if(!markers)return;markers.innerHTML='';
    const rng=window._scrubRange?.();const max=rng?+rng.max:5000;
    kfStore.forEach(kfs=>{
      kfs.filter(k=>k.slide===current).forEach(kf=>{
        const pct=(kf.time/max)*100;
        const d=document.createElement('div');
        d.style.cssText=`position:absolute;left:${pct}%;top:50%;width:8px;height:8px;background:var(--amber);transform:translate(-50%,-50%) rotate(45deg);border-radius:1px;opacity:.85;pointer-events:none`;
        markers.appendChild(d);
      });
    });
  };

  function buildAnim(el,sel,slideIdx){
    const old=kfAnims.get(sel);if(old)old.cancel();
    const kfs=(kfStore.get(sel)||[]).filter(k=>k.slide===slideIdx);
    if(kfs.length<2)return;
    const dur=kfs[kfs.length-1].time-kfs[0].time;if(dur<=0)return;
    const t0=kfs[0].time;
    const frames=kfs.map(kf=>({
      transform:`translate(${kf.tx}px,${kf.ty}px) rotate(${kf.rot}deg) scale(${kf.scale})`,
      offset:(kf.time-t0)/dur,
    }));
    el.style.transform='';el.style.transformBox='fill-box';el.style.transformOrigin='center center';
    const anim=el.animate(frames,{duration:dur,delay:t0,fill:'both',easing:'ease-in-out'});
    if(window._scrubPaused?.()){anim.pause();try{anim.currentTime=Math.max(0,(window._scrubTime?.()??0)-t0);}catch(e){}}
    kfAnims.set(sel,anim);tMap.delete(el);
  }

  window._kfRebuild=function(){
    kfAnims.forEach(a=>a.cancel());kfAnims.clear();
    kfStore.forEach((kfs,sel)=>{
      if(kfs.filter(k=>k.slide===current).length>=2){
        const el=document.querySelector(sel);if(el)buildAnim(el,sel,current);
      }
    });
  };

  window.kfAddKeyframe=function(el,xform){
    const sel=aSel(el),time=window._scrubTime?.()??0;
    if(!kfStore.has(sel))kfStore.set(sel,[]);
    const kfs=kfStore.get(sel);
    const idx=kfs.findIndex(k=>k.slide===current&&Math.abs(k.time-time)<5);
    const kf={slide:current,time,tx:xform.tx,ty:xform.ty,scale:xform.scale,rot:xform.rot};
    if(idx>=0)kfs[idx]=kf;else kfs.push(kf);
    kfs.sort((a,b)=>a.time-b.time);
    const slideKfs=kfs.filter(k=>k.slide===current);
    if(slideKfs.length>=2)buildAnim(el,sel,current);
    // Extend scrubber if needed
    const rng=window._scrubRange?.();if(rng&&time>+rng.max)rng.max=time;
    window._kfRenderMarkers();saveKf();
    annoToast(`◆ Keyframe at ${time}ms (${slideKfs.length} total)`);
  };

  delBtn?.addEventListener('click',()=>{
    const time=window._scrubTime?.()??0;let deleted=false;
    kfStore.forEach((kfs,sel)=>{
      const idx=kfs.findIndex(k=>k.slide===current&&Math.abs(k.time-time)<20);
      if(idx>=0){kfs.splice(idx,1);deleted=true;
        const rem=kfs.filter(k=>k.slide===current);
        if(rem.length<2){const a=kfAnims.get(sel);if(a){a.cancel();kfAnims.delete(sel);}}
        else{const el=document.querySelector(sel);if(el)buildAnim(el,sel,current);}
        if(!kfs.length)kfStore.delete(sel);
      }
    });
    if(deleted){window._kfRenderMarkers();saveKf();delBtn.style.display='none';annoToast(`Keyframe deleted at ${time}ms`);}
  });

  function saveKf(){
    const arr=aL().filter(a=>a.type!=='keyframe');
    kfStore.forEach((kfs,sel)=>{if(kfs.length)arr.push({selector:sel,context:`keyframes (${kfs.length})`,text:'KEYFRAMES '+kfs.map(k=>k.time+'ms').join(', '),timestamp:new Date().toISOString(),type:'keyframe',keyframes:kfs});});
    aS(arr);aRender();
  }
  function loadKf(){
    kfStore.clear();
    aL().filter(a=>a.type==='keyframe').forEach(a=>{if(a.keyframes&&a.selector)kfStore.set(a.selector,a.keyframes);});
  }
  window.kfOnSlideEnter=function(){loadKf();setTimeout(()=>{window._kfRebuild?.();window._kfRenderMarkers?.();},500);};
})();

  if(ty==='lesson'&&SECTIONS[si])return SECTIONS[si].lesson.notes||'';
  if(ty==='case'&&SECTIONS[si]){
    // figure out which case within the section
    let caseIdx=0;for(let j=lessonIdxs[si]+1;j<idx;j++){if(allSlides[j]?.dataset.type==='case')caseIdx++;}
    return SECTIONS[si].cases[caseIdx]?.notes||'';
  }
  if(ty==='bonus')return'The secret 5th rung is the one already in your pocket. You too have a productizable tool your team has been using and honing - just look at the systems you\'re implementing and see what can be carved out and polished up';
  if(ty==='cover')return'Welcome the audience. Wait for stragglers. Introduce yourself and the talk theme.';
  if(ty==='close')return'Wrap up. Point to the QR codes. Thank the audience. Open for questions.';
  if(ty==='map')return'The constellation map is a visual summary of the journey. Let it breathe for a moment before moving on.';
  if(ty==='settings')return'Settings slide. Not shown to the audience during presentation mode.';
  return'';
}

// FEATURE: TALK DURATION ESTIMATOR
// =====================================================================
function estimateSlideDuration(idx){
  const notes=getSlideNotes(idx);
  const sl=allSlides[idx];
  const ty=sl?.dataset.type||'';
  let seconds=0;
  if(!notes||notes.trim()===''){
    seconds=30; // no notes default
  }else{
    const lines=notes.split('\n').filter(l=>l.trim());
    lines.forEach(line=>{
      const trimmed=line.trim();
      const isBullet=/^[-\u2022*]/.test(trimmed);
      const wordCount=trimmed.split(/\s+/).length;
      if(isBullet||wordCount<15){
        seconds+=20; // bullet point: ~20s
      }else{
        seconds+=Math.ceil(wordCount/150*60); // full sentence: words/150 WPM
      }
    });
  }
  // Lesson slides: add 10 seconds natural pause
  if(ty==='lesson'||ty==='bonus')seconds+=10;
  // Steps: add 5s per step beyond first
  const ss=slideSteps.get(sl);
  if(ss&&ss.steps.length>1)seconds+=(ss.steps.length-1)*5;
  return seconds;
}

function calcTotalDuration(){
  let total=0;
  for(let i=0;i<allSlides.length;i++){
    if(allSlides[i].dataset.hidden==='1')continue;
    total+=estimateSlideDuration(i);
  }
  return total;
}

function fmtTime(secs){
  const m=Math.floor(secs/60),s=Math.floor(secs%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function updateDurationDisplay(){
  const el=document.getElementById('v-duration');
  if(el)el.textContent='~'+fmtTime(calcTotalDuration());
}

// Timer & pacing
let _timerInterval=null;
function startTalkTimer(){
  if(_talkStartTime)return;
  _talkStartTime=Date.now();
  _timerInterval=setInterval(updateTimers,1000);
}
function updateTimers(){
  if(!_talkStartTime)return;
  const elapsedSec=Math.floor((Date.now()-_talkStartTime)/1000);
  const totalEst=calcTotalDuration();
  const remainSec=Math.max(0,totalEst-elapsedSec);
  const elapsed=fmtTime(elapsedSec);
  const remaining='~'+fmtTime(remainSec);
  let paceIcon='\uD83D\uDFE2'; // green
  if(elapsedSec>totalEst*1.25)paceIcon='\uD83D\uDD34'; // red 25%+
  else if(elapsedSec>totalEst*1.1)paceIcon='\uD83D\uDFE1'; // yellow 10%+
  // Haptic pacing alerts (mobile only \u2014 navigator.vibrate is no-op on desktop)
  if(remainSec<60&&remainSec>0){
    // Last minute: hard double-pulse every 10 seconds
    const tenSec=Math.floor(elapsedSec/10);
    if(tenSec!==_lastVibTenSec){_lastVibTenSec=tenSec;navigator.vibrate?.([250,80,250]);}
  }else if(elapsedSec>totalEst*1.1){
    // Running behind by >10%: single light pulse once per minute
    const minute=Math.floor(elapsedSec/60);
    if(minute!==_lastVibMinute){_lastVibMinute=minute;navigator.vibrate?.(120);}
  }
  const data={type:'timer-update',elapsed,remaining,paceIcon};
  _notesCh.postMessage(data);
  if(_notesWin&&!_notesWin.closed){
    const doc=_notesWin.document;
    if(doc.getElementById('pn-elapsed')){
      doc.getElementById('pn-elapsed').textContent=elapsed;
      doc.getElementById('pn-remain').textContent=remaining;
      doc.getElementById('pn-pace-icon').textContent=paceIcon;
    }
  }
}

async function runInlineExport(){
  const prog=document.getElementById('em-progress');
  const btn=document.getElementById('em-inline');
  btn.disabled=true;
  prog.textContent='Fetching external resources...';
  try{
    // Clone the document
    const html=document.documentElement.cloneNode(true);
    // Inline Google Fonts
    const fontLinks=html.querySelectorAll('link[href*="fonts.googleapis"]');
    for(const link of fontLinks){
      try{
        prog.textContent='Fetching fonts from '+link.href.substring(0,60)+'...';
        const resp=await fetch(link.href);
        const css=await resp.text();
        // Fetch each woff2 url and convert to base64
        const urls=[...css.matchAll(/url\(([^)]+)\)/g)].map(m=>m[1]);
        let inlinedCSS=css;
        for(const url of urls){
          try{
            const fontResp=await fetch(url);
            const blob=await fontResp.blob();
            const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
            inlinedCSS=inlinedCSS.replace(url,b64);
          }catch(e){/* skip individual font */}
        }
        const style=document.createElement('style');
        style.textContent=inlinedCSS;
        link.parentNode.replaceChild(style,link);
      }catch(e){/* skip font link */}
    }
    // Inline QR codes
    const qrImgs=html.querySelectorAll('img[src*="api.qrserver"]');
    for(const img of qrImgs){
      try{
        prog.textContent='Fetching QR code...';
        const resp=await fetch(img.src);
        const blob=await resp.blob();
        const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
        img.src=b64;
      }catch(e){/* skip */}
    }
    // Remove preconnect links
    html.querySelectorAll('link[rel="preconnect"]').forEach(l=>l.remove());
    // Build download blob
    prog.textContent='Building self-contained file...';
    const blob=new Blob(['<!DOCTYPE html>\n'+html.outerHTML],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='spatial-deck-offline.html';
    a.style.cssText='display:inline-block;margin-top:10px;color:var(--teal);font-weight:600;font-size:.82rem;text-decoration:underline;cursor:pointer;';
    a.textContent='Download spatial-deck-offline.html ('+Math.round(blob.size/1024)+' KB)';
    prog.textContent='';
    prog.appendChild(a);
    btn.disabled=false;
  }catch(e){
    prog.textContent='Error: '+e.message;
    btn.disabled=false;
  }
}

// =====================================================================
// FEATURE: PACING MATH UPGRADES
// (over video) marker · adaptive WPM · projected wall-clock finish
// =====================================================================
const OVER_VIDEO_RE=/\(\s*over\s+video\s*\)/i;
window._notesOverrides=new Map();   // idx -> {script, bullets, video_seconds, type, title}
window._videoDurationCache={};       // src -> seconds
window._slideThumbs={};              // idx -> dataUrl
window._notesMeta={};                // {target_finish, default_view, wpm}
window._adaptiveWpm=null;            // rolling WPM, set after a few advances
let _wpmSamples=[];                  // [{words, seconds}]

function _wordsCount(s){return (s||'').trim().split(/\s+/).filter(Boolean).length;}
function _splitOverVideo(script){
  if(!script)return{pre:'',over:''};
  const m=script.match(OVER_VIDEO_RE);
  if(!m)return{pre:script,over:''};
  const i=m.index;
  return{pre:script.slice(0,i).trim(),over:script.slice(i+m[0].length).trim()};
}
function _videoSecondsFor(idx){
  const ov=_notesOverrides.get(idx);
  if(ov&&ov.video_seconds!=null)return Number(ov.video_seconds)||0;
  const sl=allSlides[idx];if(!sl)return 0;
  let total=0;
  sl.querySelectorAll('video').forEach(v=>{
    const cached=v.src&&_videoDurationCache[v.src];
    if(cached)total+=Number(cached)||0;
    else if(isFinite(v.duration)&&v.duration>0)total+=v.duration;
  });
  return total;
}
function _effectiveWpm(){
  if(_notesMeta.wpm)return Number(_notesMeta.wpm);
  if(_adaptiveWpm)return _adaptiveWpm;
  return 150;
}
// Override estimateSlideDuration if it exists
if(typeof estimateSlideDuration==='function'){
  window._origEstimateSlideDuration=estimateSlideDuration;
  window.estimateSlideDuration=function(idx){
    const sl=allSlides[idx];if(!sl)return 30;
    const ov=_notesOverrides.get(idx);
    const script=ov&&ov.script!=null?ov.script:getSlideNotes(idx);
    if(!script||!script.trim())return _origEstimateSlideDuration(idx);
    const{pre,over}=_splitOverVideo(script);
    const vidSec=_videoSecondsFor(idx);
    const wpm=_effectiveWpm();
    const preSec=_wordsCount(pre)/wpm*60;
    // Words AFTER (over video) are spoken concurrently with the video.
    // Slide time = pre-speech + max(video_dur, over-speech).
    const overSec=_wordsCount(over)/wpm*60;
    const concurrent=Math.max(vidSec,overSec);
    let total=preSec+concurrent;
    const ty=sl.dataset.type||'';
    if(ty==='lesson'||ty==='bonus')total+=10;
    const ss=slideSteps.get(sl);
    if(ss&&ss.steps.length>1)total+=(ss.steps.length-1)*5;
    return Math.max(5,Math.round(total));
  };
}
function calcEstimateFromIdx(fromIdx){
  let total=0;
  for(let i=fromIdx;i<allSlides.length;i++){
    if(allSlides[i].dataset.hidden==='1')continue;
    total+=estimateSlideDuration(i);
  }
  return total;
}
function calcConsumedThrough(idx){
  let total=0;
  for(let i=0;i<=idx&&i<allSlides.length;i++){
    if(allSlides[i].dataset.hidden==='1')continue;
    total+=estimateSlideDuration(i);
  }
  return total;
}
// Hook slide advance to feed adaptive WPM
window._notesPrevAdvance={idx:null,t:null};
function _onSlideChange(newIdx){
  const prev=_notesPrevAdvance;
  if(prev.idx!=null&&prev.t!=null&&_talkStartTime){
    const sl=allSlides[prev.idx];
    if(sl&&sl.dataset.hidden!=='1'){
      const ov=_notesOverrides.get(prev.idx);
      const script=ov&&ov.script!=null?ov.script:getSlideNotes(prev.idx);
      const{pre,over}=_splitOverVideo(script||'');
      const wordsSpoken=_wordsCount(pre)+_wordsCount(over);
      const elapsedOnSlide=(Date.now()-prev.t)/1000;
      // Subtract concurrent video time from elapsed for WPM calc, since words run alongside video
      const vidSec=_videoSecondsFor(prev.idx);
      const speakingTime=Math.max(1,elapsedOnSlide-Math.min(vidSec,elapsedOnSlide*.6));
      if(wordsSpoken>15&&speakingTime>10){
        _wpmSamples.push({words:wordsSpoken,seconds:speakingTime});
        if(_wpmSamples.length>=3){
          const recent=_wpmSamples.slice(-8);
          const wTotal=recent.reduce((a,s)=>a+s.words,0);
          const sTotal=recent.reduce((a,s)=>a+s.seconds,0);
          const calc=wTotal/sTotal*60;
          _adaptiveWpm=Math.max(90,Math.min(220,calc));
        }
      }
    }
  }
  _notesPrevAdvance={idx:newIdx,t:Date.now()};
}

window._notesConfig=null;

async function syncCall(action,extra){
  const cfg=await loadNotesConfig();if(!cfg){const e=new Error('offline');e._offline=true;throw e;}
  const payload=Object.assign({action,deckId:cfg.deckId},extra||{});
  const resp=await fetch(cfg.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  const data=await resp.json();

}

function _fmtClock(d){const h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';const h12=((h+11)%12)+1;return h12+':'+String(m).padStart(2,'0')+' '+ap;}
function _fmtMS(s){const sign=s<0?'-':'';s=Math.abs(s);const m=Math.floor(s/60),sec=Math.floor(s%60);return sign+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

// Sentence-split bullets (cheap)
function autoBullets(script){
  if(!script||!script.trim())return[];
  const cleaned=script.replace(OVER_VIDEO_RE,' ').replace(/\s+/g,' ').trim();
  const sentences=cleaned.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[cleaned];
  return sentences.map(s=>{
    const t=s.trim();if(!t)return null;
    const w=t.split(/\s+/);
    if(w.length<=14)return t;
    return w.slice(0,14).join(' ')+'…';
  }).filter(Boolean).slice(0,8);
}
function bulletsForSlide(idx){
  const ov=_notesOverrides.get(idx);
  if(ov&&Array.isArray(ov.bullets)&&ov.bullets.length)return ov.bullets;
  const script=ov&&ov.script!=null?ov.script:getSlideNotes(idx);
  return autoBullets(script);
}
function scriptForSlide(idx){
  const ov=_notesOverrides.get(idx);
  return ov&&ov.script!=null?ov.script:(getSlideNotes(idx)||'');
}

function _renderTopbar(){

    else tLine.textContent='no target set';

      proj.className='na-projected '+(diffMin>5?'late':diffMin>2?'warn':'');

    }
  }else{tLine.textContent='no target set';dot.className='na-pace-dot';}
}
